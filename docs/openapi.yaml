openapi: 3.1.0
info:
  title: Mosquitto Control Manager API
  version: 0.1.0
  description: |
    Operational REST and WebSocket API for MCM, the control plane for Eclipse
    Mosquitto. All `/api/v1/*` endpoints (except `POST /api/v1/auth/login` and
    `GET /api/v1/status`) require a Bearer JWT obtained from `POST /api/v1/auth/login`.

    Endpoints are gated by role (`viewer < auditor < operator < admin`). The role
    that owns each operation is documented in its `description`.

    The broker events stream upgrades to WebSocket and authenticates via the
    `Sec-WebSocket-Protocol` header (`mcm.v1, Bearer.<token>`) rather than the
    `Authorization` header so tokens never appear in proxy/query logs.
  contact:
    name: MCM project
    url: https://github.com/fgjcarlos/mcm
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://{host}
    description: MCM HTTP API
    variables:
      host:
        default: mcm.your-domain.example
        description: The host MCM is reachable at; substitute your deployment hostname.
tags:
  - name: Health
    description: Liveness and broker status probes that do not require authentication.
  - name: Metrics
    description: Prometheus text-format scrape target.
  - name: Auth
    description: Admin login and current-session endpoints.
  - name: Admin Users
    description: MCM admin user CRUD, gated by role.
  - name: ACLs
    description: Mosquitto ACL rule CRUD, gated by role.
  - name: JSON Schemas
    description: JSON Schema validators attached to MQTT topic filters.
  - name: Audit
    description: Read-only access to the persistent admin audit trail.
  - name: Security
    description: Read-only access to recent security events (failed logins, lockouts, denials).
  - name: Broker
    description: Realtime broker event stream over WebSocket.
  - name: MQTT Users
    description: Mosquitto broker user CRUD (passwd entries). Password material is returned only on create / reset.
  - name: Deployments
    description: Preview and apply the rendered Mosquitto password_file and acl_file snapshots.
  - name: Certificates
    description: Broker TLS certificate profiles, their immutable revisions and the rotation lifecycle. Private key material is write-only and never appears in a response.
  - name: Settings
    description: Redacted view of the running configuration.
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Returns 200 OK with a static body. Use this for process liveness and restart decisions. Unauthenticated by design so probes can hit it without credentials.
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]
  /livez:
    get:
      tags: [Health]
      summary: Process liveness probe
      description: |
        Lightweight liveness probe that does not touch storage or the broker.
        Returns 200 as long as the HTTP server is accepting connections.
        Unauthenticated by design — gate at the network level for production.
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: |
        Checks required serving dependencies — SQLite is reachable AND the
        configured Mosquitto broker is connected. Use this for load-balancer
        or orchestrator readiness gates; use `/api/v1/status` for the broker
        snapshot shown to operators instead.
        Returns 200 when both are healthy and 503 when either dependency is
        unavailable (response body carries the failing dependency name).
      security: []
      responses:
        "200":
          description: Service is ready to receive traffic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                required: [status]
        "503":
          description: Service is temporarily not ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: not_ready
                  error:
                    type: string
                    example: database unavailable
                required: [status]
  /metrics:
    get:
      tags: [Metrics]
      summary: Prometheus metrics
      description: |
        Prometheus text exposition format. See README for the metric reference.
        HTTP metric labels are bounded: `route` is the ServeMux path pattern
        without the method prefix (for example `/api/v1/admin-users/{id}`),
        unmatched requests use `route="unmatched"`, and raw URLs are never used.
        Unauthenticated by design — gate at reverse proxy / network policy in production.
      security: []
      responses:
        "200":
          description: Prometheus text format.
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP mcm_broker_status 1 when the configured Mosquitto broker is connected, 0 otherwise.
                  # TYPE mcm_broker_status gauge
                  mcm_broker_status 1
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Exchange admin credentials for a Bearer token
      description: |
        Returns a JWT carrying the user's role. Rate-limited per IP and per
        username; six failed attempts within `auth.login_lockout.window` lock
        out the next attempt with HTTP 429 and a `Retry-After` header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: admin
              password: s3cure-Adm1n-pass!
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Missing username or password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid credentials, disabled user, or generic auth failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many failed login attempts.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
              description: Seconds until the oldest failure ages out of the lockout window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/auth/login/mfa:
    post:
      tags: [Auth]
      summary: Complete an MFA-protected login
      description: |
        Exchanges the `mfa_challenge` returned by `POST /api/v1/auth/login` for a
        full access token, given a valid TOTP code or single-use recovery code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginMFARequest" }
      responses:
        "200":
          description: MFA verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400":
          description: Missing fields.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid challenge, expired challenge, or invalid TOTP / recovery code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/auth/mfa/setup:
    post:
      tags: [Auth]
      summary: Begin TOTP MFA enrollment
      description: |
        Generates a fresh TOTP secret and a set of single-use recovery codes for
        the current user. The secret stays "pending" (`mfa_enabled` does not flip)
        until a matching code is sent to `POST /api/v1/auth/mfa/verify`.

        The plaintext recovery codes are returned exactly once. Show them to the
        operator, then drop them — only their bcrypt hashes are persisted.
      responses:
        "200":
          description: Pending enrollment payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFASetupResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Finish TOTP MFA enrollment
      description: Validates the first TOTP code from the pending secret and flips `mfa_enabled` to true.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MFAVerifyRequest" }
      responses:
        "204": { description: MFA is now enabled for the user. }
        "400":
          description: Missing code or no pending enrollment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/mfa:
    delete:
      tags: [Auth]
      summary: Disable TOTP MFA for the current user
      description: Requires the operator to re-enter their password. Clears the secret and revokes all recovery codes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MFADisableRequest" }
      responses:
        "204": { description: MFA disabled. }
        "400":
          description: Missing password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or invalid bearer token, or wrong password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      description: Available to any authenticated user (viewer+).
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/status:
    get:
      tags: [Health]
      summary: Broker connection snapshot
      description: Unauthenticated operator/dashboard snapshot; reports broker status, target address, and recent traffic metrics. This is not a liveness probe; use `/healthz` for liveness and `/readyz` for traffic readiness.
      security: []
      responses:
        "200":
          description: Broker status snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }
  /api/v1/admin-users:
    get:
      tags: [Admin Users]
      summary: List admin users
      description: Requires auditor or higher.
      responses:
        "200":
          description: Admin user list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin Users]
      summary: Create admin user
      description: Requires admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserRequest" }
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400":
          description: Invalid request body (missing fields, invalid role, etc).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin-users/{id}:
    parameters:
      - $ref: "#/components/parameters/AdminUserID"
    get:
      tags: [Admin Users]
      summary: Get admin user
      description: Requires auditor or higher.
      responses:
        "200":
          description: Admin user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Admin Users]
      summary: Update admin user
      description: Requires admin. Password is optional on update (omit to keep current).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserRequest" }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Admin Users]
      summary: Delete admin user
      description: Requires admin. The request body is ignored — only the path ID is read.
      responses:
        "204": { description: User deleted. }
        "400":
          description: Invalid path ID (not a positive integer).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/acls:
    get:
      tags: [ACLs]
      summary: List ACL rules
      description: Requires auditor or higher.
      responses:
        "200":
          description: ACL rule list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items: { $ref: "#/components/schemas/ACLRule" }
                required: [rules]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [ACLs]
      summary: Create ACL rule
      description: Requires operator or higher.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ACLRuleRequest" }
      responses:
        "201":
          description: Rule created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ACLRule" }
        "400": { $ref: "#/components/responses/ACLValidation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/acls/{id}:
    parameters:
      - $ref: "#/components/parameters/ACLRuleID"
    put:
      tags: [ACLs]
      summary: Update ACL rule
      description: Requires operator or higher.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ACLRuleRequest" }
      responses:
        "200":
          description: Updated rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ACLRule" }
        "400": { $ref: "#/components/responses/ACLValidation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [ACLs]
      summary: Delete ACL rule
      description: Requires operator or higher.
      responses:
        "204": { description: Rule deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/acls/scopes:
    get:
      tags: [ACLs]
      summary: List the ACL files MCM manages
      description: |
        Requires auditor or higher.

        Reports the broker-wide ACL file and the per-listener ACL files of
        the listeners that own scoped rules, together with the wiring the
        broker configuration needs for them.
      responses:
        "200":
          description: The ACL files MCM manages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scopes:
                    type: array
                    items: { $ref: "#/components/schemas/ACLScope" }
                required: [scopes]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/acls/source:
    get:
      tags: [ACLs]
      summary: Read the adopted ACL source
      description: |
        Requires auditor or higher.

        Returns the verbatim content of the ACL file MCM adopted. The
        deploy composes the managed rules into it, so a file that was
        already in use keeps every line MCM does not model.
      parameters:
        - name: path
          in: query
          required: false
          description: The ACL file to read. Defaults to the file MCM manages.
          schema: { type: string }
      responses:
        "200":
          description: The adopted ACL source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ACLSource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/acls/source/adopt:
    post:
      tags: [ACLs]
      summary: Adopt an existing ACL file
      description: |
        Requires operator or higher.

        Takes an existing ACL file under the management of MCM. The content
        is stored verbatim and the deploy composes the managed rules into
        it. The preview of the deploy reports the access the composition
        would drop, and an apply that would drop access MCM can neither
        reproduce nor attribute to a managed MQTT user is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ACLSourceAdoptRequest" }
      responses:
        "200":
          description: The adopted ACL source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ACLSource" }
        "400": { $ref: "#/components/responses/ACLValidation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/acls/effective:
    get:
      tags: [ACLs]
      summary: Resolve the effective MQTT permissions
      description: |
        Requires auditor or higher.

        Resolves the rules into the permissions every identity really has,
        with the semantics of Mosquitto: a deny rule is handled before a
        grant, the anonymous section applies to unauthenticated clients
        only, and the pattern rules apply to every client.
      responses:
        "200":
          description: The effective permissions per ACL file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scopes:
                    type: array
                    items: { $ref: "#/components/schemas/EffectiveScope" }
                required: [scopes]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/acls/effective/simulate:
    post:
      tags: [ACLs]
      summary: Simulate one access question
      description: |
        Requires auditor or higher.

        Answers what a client may do on a topic, with the same rules the
        broker applies.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ACLSimulationRequest" }
      responses:
        "200":
          description: The verdict of the simulation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ACLSimulationDecision" }
        "400": { $ref: "#/components/responses/ACLValidation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/json-schemas:
    get:
      tags: [JSON Schemas]
      summary: List JSON schema validators
      description: Requires auditor or higher.
      responses:
        "200":
          description: Schema definition list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items: { $ref: "#/components/schemas/JSONSchemaDefinition" }
                required: [schemas]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [JSON Schemas]
      summary: Create JSON schema validator
      description: Requires operator or higher.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JSONSchemaRequest" }
      responses:
        "201":
          description: Schema created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JSONSchemaDefinition" }
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/json-schemas/{id}:
    parameters:
      - $ref: "#/components/parameters/JSONSchemaID"
    put:
      tags: [JSON Schemas]
      summary: Update JSON schema validator
      description: Requires operator or higher.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JSONSchemaRequest" }
      responses:
        "200":
          description: Updated schema.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JSONSchemaDefinition" }
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [JSON Schemas]
      summary: Delete JSON schema validator
      description: Requires operator or higher. The request body is ignored — only the path ID is read.
      responses:
        "204": { description: Schema deleted. }
        "400":
          description: Invalid path ID (not a positive integer).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/audit-events:
    get:
      tags: [Audit]
      summary: List recent audit events
      description: Requires auditor or higher.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Audit event page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  limit: { type: integer }
                  offset: { type: integer }
                required: [events]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/security/events:
    get:
      tags: [Security]
      summary: List recent security events
      description: Requires auditor or higher.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Security event list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/SecurityEvent" }
                required: [events]
        "400":
          description: Invalid query parameter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/mqtt-users:
    get:
      tags: [MQTT Users]
      summary: List MQTT broker users
      description: Requires auditor or higher. Password material is never returned.
      responses:
        "200":
          description: MQTT user list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MQTTUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [MQTT Users]
      summary: Create MQTT broker user
      description: |
        Requires operator or higher. The server generates a random 24-character
        password, hashes it for Mosquitto, and returns the cleartext in the
        response — surface it to the operator exactly once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MQTTUserRequest" }
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MQTTUserWithPassword" }
        "400":
          description: Missing username.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Username already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/mqtt-users/{id}:
    parameters:
      - $ref: "#/components/parameters/MQTTUserID"
    get:
      tags: [MQTT Users]
      summary: Get MQTT broker user
      description: Requires auditor or higher.
      responses:
        "200":
          description: MQTT user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MQTTUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [MQTT Users]
      summary: Update MQTT broker user
      description: Requires operator or higher. Username and disabled are optional.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MQTTUserUpdateRequest" }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MQTTUser" }
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [MQTT Users]
      summary: Delete MQTT broker user
      description: Requires operator or higher.
      responses:
        "204": { description: User deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/mqtt-users/{id}/reset-password:
    parameters:
      - $ref: "#/components/parameters/MQTTUserID"
    post:
      tags: [MQTT Users]
      summary: Reset MQTT broker user password
      description: |
        Requires operator or higher. Generates a fresh random password, stores
        the new hash, and returns the cleartext — surface it exactly once.
      responses:
        "200":
          description: New credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MQTTUserWithPassword" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/deployments:
    get:
      tags: [Deployments]
      summary: List recent deployments
      description: Requires auditor or higher.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Deployment page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deployments:
                    type: array
                    items: { $ref: "#/components/schemas/Deployment" }
                required: [deployments]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Deploy is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/deployments/preview:
    post:
      tags: [Deployments]
      summary: Preview the next deploy
      description: |
        Requires operator or higher. Returns the diff and the full rendered
        bodies that the next apply would write, without touching the broker.
      responses:
        "200":
          description: Rendered preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Deploy is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/deployments/apply:
    post:
      tags: [Deployments]
      summary: Apply pending changes
      description: |
        Requires admin. Apply the exact immutable preview identified by the
        required `revision_id`; callers must preview first. Persists the
        resulting `Deployment` row and (when configured) triggers a reload on
        the broker. Returns 409 if a deploy is already in progress or the
        preview revision has already been consumed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentApplyRequest" }
      responses:
        "200":
          description: Deployment record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Deploy is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A deploy is already in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/listeners:
    get:
      tags: [Listeners]
      summary: List currently active listener specs
      description: |
        Requires viewer or higher. Returns the persisted listener specs
        ordered by bind then port.
      responses:
        "200":
          description: Listener page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  specs:
                    type: array
                    items: { $ref: "#/components/schemas/ListenerSpecRow" }
                  compose_host_ports:
                    type: array
                    description: Optional non-blocking Compose host-port hints; omitted if Compose port discovery fails.
                    items: { type: integer }
                required: [specs]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/listeners/preview:
    post:
      tags: [Listeners]
      summary: Preview the next listener apply
      description: |
        Requires operator or higher. Validates the desired listener specs,
        returns a rendered `mosquitto.conf` diff, and reserves an immutable
        revision id. To bypass the docker-compose port coexistence check,
        send `confirm: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/ListenerPreviewRequest"
      responses:
        "200":
          description: Preview result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListenerPreviewResult" }
        "400":
          description: Validation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: 'Compose port coexistence failed; pass confirm=true to override.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/listeners/apply:
    post:
      tags: [Listeners]
      summary: Apply the previewed listener change
      description: |
        Requires admin. Triggers the broker restart implied by the previewed
        listener set; persists the new specs on success. Returns 409 on
        immutable-revision errors, on `confirm` rejection when a restart is
        required, or while another apply is in flight.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListenerApplyRequest" }
      responses:
        "200":
          description: Listener revision applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListenerApplyResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Preview revision not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Preview revision expired, consumed, confirmation required, or another apply is in flight.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Broker restart failed; state preserved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/broker/certificates:
    get:
      tags: [Certificates]
      summary: List the broker certificate profiles
      description: |
        Requires auditor or higher. Returns every profile with its revisions,
        the active revision and the expiry status of the material. No response
        carries private key material.
      responses:
        "200":
          description: Certificate profiles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items: { $ref: "#/components/schemas/CertificateProfile" }
                required: [profiles]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/broker/certificates/profiles/{name}/revisions:
    post:
      tags: [Certificates]
      summary: Upload a new certificate revision
      description: |
        Requires operator or higher. Validates the uploaded material, stores it
        as an immutable pending revision and returns its public metadata. The
        private key is write-only: it is stored on disk and never returned.
      parameters:
        - name: name
          in: path
          required: true
          description: Certificate profile name.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateRevisionRequest" }
      responses:
        "201":
          description: Revision stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateRevision" }
        "400":
          description: The material was rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/broker/certificates/preview:
    post:
      tags: [Certificates]
      summary: Preview the activation of a certificate revision
      description: |
        Requires operator or higher. Describes the rotation without changing
        anything: the revision, its validity window, the broker-side paths the
        broker will read and the restart the activation implies.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateActionRequest" }
      responses:
        "200":
          description: Preview result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificatePreview" }
        "400":
          description: Invalid profile name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Profile or revision not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/broker/certificates/apply:
    post:
      tags: [Certificates]
      summary: Activate a certificate revision
      description: |
        Requires admin. Installs the revision, restarts the broker and verifies
        that the broker really serves the new material with a TLS handshake. If
        the restart or the verification fails, the previous revision is
        restored, the broker restarts again and the revision is recorded as
        failed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateActionRequest" }
      responses:
        "200":
          description: Revision activated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateApplyResult" }
        "400":
          description: Invalid profile name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Profile or revision not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The revision is already active.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: |
            The broker did not serve the new material. The previous revision was
            restored, the broker restarted again and the revision was recorded as
            failed. The response carries the recovery state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateApplyFailure" }
  /api/v1/settings:
    get:
      tags: [Settings]
      summary: Current effective settings
      description: |
        Requires admin. Returns a redacted view of the running configuration
        (no secrets, no TLS private keys, no JWT signing material).
      responses:
        "200":
          description: Effective settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/broker/events:
    get:
      tags: [Broker]
      summary: Broker events WebSocket
      description: |
        Upgrades to a WebSocket that streams `BrokerEvent` JSON frames as they are
        observed. Available to any authenticated user.

        **Authentication**: clients send `Sec-WebSocket-Protocol: mcm.v1, Bearer.<token>`
        instead of `Authorization`. The handshake response confirms the negotiated
        subprotocol with `Sec-WebSocket-Protocol: mcm.v1`. This keeps the JWT out
        of URL query logs that intermediaries might capture.

        On every connect the server replays the cached `broker_status` and the bounded
        log buffer before live events stream.
      parameters:
        - in: header
          name: Upgrade
          required: true
          schema: { type: string, enum: [websocket] }
        - in: header
          name: Sec-WebSocket-Protocol
          required: true
          schema:
            type: string
            description: Must contain `mcm.v1` and `Bearer.<token>`.
            example: "mcm.v1, Bearer.eyJhbGciOi..."
      responses:
        "101":
          description: |
            Switching Protocols. `Sec-WebSocket-Protocol: mcm.v1`. Subsequent frames
            are JSON-encoded `BrokerEvent` records.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerEvent" }
        "400":
          description: Request did not include WebSocket upgrade headers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or invalid `Bearer.<token>` subprotocol.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/broker/config:
    get:
      tags: [Broker]
      summary: Get the current broker configuration
      description: |
        Requires auditor or higher. Returns the absolute path of the managed
        `mosquitto.conf`, its on-disk body, and a sha256 fingerprint. Returns
        503 when broker-config management is not configured.
      responses:
        "200":
          description: Current broker configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Broker config management is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/broker/config/import:
    post:
      tags: [Broker]
      summary: Preview the next broker-config apply
      description: |
        Requires operator or higher. Parses the configured `mosquitto.conf`,
        resolves the include_dir tree, validates against the loaded directive
        catalog, and stores an immutable preview revision. Returns the same
        shape as `POST /api/v1/broker/config/preview`; the two endpoints are
        aliases kept for ergonomic reasons (the UI calls `/preview` after
        the operator types changes and `/import` after a file upload).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrokerConfigImportRequest" }
      responses:
        "200":
          description: Broker-config preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerConfigPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Broker config management is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/broker/config/preview:
    post:
      tags: [Broker]
      summary: Preview the next broker-config apply (alias of /import)
      description: |
        Requires operator or higher. Same response as `POST
        /api/v1/broker/config/import`; the two endpoints are aliases so the UI
        can use a stable name regardless of whether the operator typed or
        uploaded the changes.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrokerConfigImportRequest" }
      responses:
        "200":
          description: Broker-config preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerConfigPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Broker config management is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/broker/config/adopt:
    post:
      tags: [Broker]
      summary: Adopt the imported broker configuration
      description: |
        Requires admin. Records an explicit operator adoption of the
        imported `mosquitto.conf` (and its include_dir tree) so a subsequent
        apply can proceed without passing `adopt=true` on the apply call.
        Returns the resulting adoption row.
      responses:
        "200":
          description: Recorded adoption row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerConfigAdoption" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Broker config management is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/broker/config/apply:
    post:
      tags: [Broker]
      summary: Apply a broker-config preview revision
      description: |
        Requires admin. Applies the immutable preview identified by the
        required `revision_id`; callers must preview first. Returns the
        resulting `Deployment` row. 409 covers the lifecycle sentinels
        (`requires_restart`, `adoption_required`, revision mismatch/expired/
        consumed, deploy in progress); 400 covers `revision_id` missing;
        503 covers broker-config not configured.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrokerConfigApplyRequest" }
      responses:
        "200":
          description: Broker-config deployment record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "400":
          description: Missing `revision_id`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            Apply refused. The body's `error` distinguishes the reason;
            `requires_restart` additionally includes a `directives` array
            listing the directives that would change the broker's reload
            semantics.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error: { type: string }
                      directives: { type: string }
                    required: [error]
        "503":
          description: Broker config management is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/broker/config/catalog:
    get:
      tags: [Broker]
      summary: Directive catalog used by the validator
      description: |
        Requires auditor or higher. Returns the loaded directive catalog so
        the UI can render a version-aware editor. The `version` field is
        the Mosquitto broker version this catalog describes.
      responses:
        "200":
          description: Loaded directive catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Broker config catalog is not loaded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/broker/settings:
    get:
      tags: [Broker]
      summary: General broker settings and the catalog description of the form
      description: |
        Requires auditor or higher. Returns the current value of every setting
        MCM manages — persistence and autosave, queues and messages,
        connections and sessions, and logging — together with the versioned
        catalog that describes each field: type, unit, accepted range, broker
        default, help text and whether a change needs a reload or a restart.

        The form is rendered from this payload, so the bounds the operator
        sees are the bounds the server enforces.
      responses:
        "200":
          description: Current settings and the form description.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerSettingsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Broker settings are not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/broker/settings/preview:
    post:
      tags: [Broker]
      summary: Preview the settings the operator edited
      description: |
        Requires operator or higher. Applies the submitted settings to the
        on-disk configuration, validates them against the catalog and stores
        an immutable preview revision. The response carries the diff, the
        directives that changed and whether the change needs a broker reload
        or a full restart.

        The preview does not touch the broker. Apply the returned
        `revision_id` through `POST /api/v1/broker/config/apply` to write
        the file and signal the broker.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrokerSettingsDocument" }
      responses:
        "200":
          description: Preview of the edited settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerConfigPreview" }
        "400":
          description: The submitted settings do not pass the catalog checks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerSettingsError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Broker settings are not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/broker/bridges:
    get:
      tags: [Broker]
      summary: Bridge connections to remote brokers
      description: |
        Requires auditor or higher. Returns the bridge connections declared
        in the managed `mosquitto.conf`: the remote address, the client ids,
        the credentials, the TLS material and the topic rules of every
        connection.

        A credential is never returned. A bridge that has a password reports
        it through `password_set`, so the editor can show that a credential
        exists without ever reading it.
      responses:
        "200":
          description: The managed bridge connections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BridgeListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Bridge management is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/broker/bridges/preview:
    post:
      tags: [Broker]
      summary: Preview the bridge connections the operator edited
      description: |
        Requires operator or higher. Replaces the connection sections of the
        managed configuration with the submitted bridges, validates them and
        stores an immutable preview revision. The response carries the diff,
        the rendered file, the directives that changed and whether the change
        needs a broker restart.

        The preview does not touch the broker. Apply the returned
        `revision_id` through `POST /api/v1/broker/bridges/apply` to write
        the file and signal the broker.

        A password the client does not send keeps the value it has on disk.
        The diff and the rendered body never contain a credential: they are
        redacted before they leave the server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BridgeDocumentRequest" }
      responses:
        "200":
          description: Preview of the edited bridges.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerConfigPreview" }
        "400":
          description: The submitted bridges did not pass the validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BridgeValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Bridge management is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/broker/bridges/apply:
    post:
      tags: [Broker]
      summary: Apply a reviewed bridge revision
      description: |
        Requires admin or higher. Writes the reviewed revision to the managed
        configuration and signals the broker.

        Mosquitto reads a bridge at start-up, so a change needs a restart.
        The apply refuses the revision with 409 when `force` is not set and
        the deployment has no restart command configured.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrokerConfigApplyRequest" }
      responses:
        "200":
          description: The deployment the apply produced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "400":
          description: The revision id is missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The revision needs a broker restart, is stale, was already
            applied, or the broker configuration has not been adopted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Bridge management is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT obtained from `POST /api/v1/auth/login`. Carries `user_id`, `username`,
        and `role` claims. Tokens are signed with HS256 using `auth.jwt_secret`.
  parameters:
    AdminUserID:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
    ACLRuleID:
      in: path
      name: id
      required: true
      schema: { type: string }
      description: Numeric string ID assigned at creation time.
    JSONSchemaID:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
    MQTTUserID:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Unauthorized:
      description: Missing or invalid Bearer token. The response is intentionally generic.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated, but the user's role does not meet the route's minimum.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ACLValidation:
      description: ACL validation failure (invalid topic filter, missing principal, unknown permission).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ACLError" }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    ACLError:
      type: object
      properties:
        error: { type: string }
        details:
          type: array
          items: { type: string }
      required: [error]
    LoginRequest:
      type: object
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, format: password, minLength: 1 }
      required: [username, password]
    LoginResponse:
      type: object
      description: |
        Either issues a token (single-factor login) or returns `mfa_required: true`
        plus a short-lived `mfa_challenge` to be exchanged at `POST /api/v1/auth/login/mfa`.
      properties:
        token: { type: string, format: jwt }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/AdminUser" }
        mfa_required: { type: boolean }
        mfa_challenge:
          type: string
          format: jwt
          description: Short-lived JWT (purpose=mfa_challenge) accepted only by `/api/v1/auth/login/mfa`.
    LoginMFARequest:
      type: object
      properties:
        mfa_challenge: { type: string, format: jwt, minLength: 1 }
        code:
          type: string
          minLength: 1
          description: TOTP code (6 digits) or one of the recovery codes returned at enrollment.
      required: [mfa_challenge, code]
    MFASetupResponse:
      type: object
      properties:
        otpauth_url:
          type: string
          description: Provisioning URI for authenticator apps; usually rendered as a QR.
        secret:
          type: string
          description: Base32 TOTP secret. Provided as a fallback for apps that cannot scan the QR.
        recovery_codes:
          type: array
          items: { type: string }
          description: Plaintext single-use recovery codes — surfaced exactly once.
      required: [otpauth_url, secret, recovery_codes]
    MFAVerifyRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: First TOTP code from the pending secret.
      required: [code]
    MFADisableRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          minLength: 1
          description: The current account password — required for re-authentication before disabling MFA.
      required: [password]
    AdminUser:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        disabled: { type: boolean }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, username, disabled, role, created_at, updated_at]
    AdminUserRequest:
      type: object
      properties:
        username: { type: string, minLength: 1 }
        password:
          type: string
          format: password
          description: Required for POST; optional on PUT (omit to keep current password).
        disabled: { type: boolean, default: false }
        role:
          $ref: "#/components/schemas/Role"
      required: [username]
    Role:
      type: string
      enum: [viewer, auditor, operator, admin]
      description: |
        - `viewer`: dashboard / status / broker WebSocket only.
        - `auditor`: viewer + read audit and security events, list ACLs/users/schemas.
        - `operator`: auditor + CRUD on ACLs and JSON schemas.
        - `admin`: full access (incl. admin user CRUD).
    ACLRule:
      type: object
      properties:
        id: { type: string }
        selector:
          $ref: "#/components/schemas/ACLSelector"
        scope:
          $ref: "#/components/schemas/ACLScope"
        listener_id:
          type: string
          description: |
            The listener whose ACL file carries the rule. It is required for
            the `listener` scope and empty for the `global` scope.
        principal: { type: string }
        topic_filter:
          type: string
          description: MQTT topic filter with `+` and `#` wildcards.
        permission: { $ref: "#/components/schemas/ACLPermission" }
        description: { type: string }
      required: [id, principal, topic_filter, permission]
    ACLRuleRequest:
      type: object
      properties:
        selector:
          $ref: "#/components/schemas/ACLSelector"
        scope:
          $ref: "#/components/schemas/ACLScope"
        listener_id:
          type: string
          description: |
            The listener whose ACL file carries the rule. It is required for
            the `listener` scope and must be empty for the `global` scope.
        principal:
          type: string
          description: |
            The MQTT username the rule applies to. Required and non-empty for
            the `user` selector; must be empty or omitted for the
            `anonymous` and `pattern` selectors. A request without a
            principal and without a `selector` is rejected, never treated as
            an anonymous rule.
        topic_filter: { type: string }
        permission: { $ref: "#/components/schemas/ACLPermission" }
        description: { type: string }
      required: [topic_filter, permission]
      additionalProperties: false
    ACLSelector:
      type: string
      description: |
        Native Mosquitto scope of the rule.

        - `user`: the rule applies to the named `principal` (an MQTT
          username). This is the scope used by rules created before native
          selectors existed, and the scope a request without a `selector`
          keeps.
        - `anonymous`: the rule applies to unauthenticated clients only.
          The `principal` must be empty. A malformed request without a
          principal is rejected instead of becoming an anonymous rule.
        - `pattern`: the rule applies to every user inside the ACL. The
          `principal` must be empty, and the topic filter may use the `%u`
          (username) and `%c` (client id) placeholders, each on its own
          topic level.
      enum: [user, anonymous, pattern]
    ACLPermission:
      type: string
      description: >-
        Permission of an ACL rule. `deny` blocks the topic filter for the
        principal and requires Mosquitto 2.0 or later; `read`, `write` and
        `readwrite` grant access and work on every supported Mosquitto
        version. A deny rule never grants access.
      enum: [read, write, readwrite, deny]
    ACLScope:
      type: string
      description: |
        The ACL file the rule is rendered into.

        - `global`: the broker-wide ACL file. The rule applies to every
          listener.
        - `listener`: the ACL file of one listener. The rule applies to that
          listener only. Mosquitto only honours a listener-local `acl_file`
          when `per_listener_settings` is enabled, and MCM refuses a deploy
          whose scoped rules the broker would ignore.
      enum: [global, listener]
    ACLScopeInfo:
      type: object
      properties:
        scope:
          $ref: "#/components/schemas/ACLScope"
        listener_id: { type: string }
        path:
          type: string
          description: The absolute path of the ACL file.
        rule_count: { type: integer }
        wired:
          type: boolean
          description: |
            Whether the broker configuration applies this file. It is false
            while the listener does not declare it or while the
            per-listener settings are disabled.
        wiring_issue:
          type: string
          description: Why the file is not applied.
      required: [scope, path, rule_count, wired]
    ACLSource:
      type: object
      properties:
        path: { type: string }
        adopted: { type: boolean }
        body:
          type: string
          description: The verbatim content of the adopted file.
        content_hash: { type: string }
      required: [path, adopted]
    ACLSourceAdoptRequest:
      type: object
      properties:
        path:
          type: string
          description: The ACL file to take over. Defaults to the file MCM manages.
        body:
          type: string
          description: |
            The verbatim content of the ACL file. It is optional: when it is
            empty MCM reads the file from `path`.
      additionalProperties: false
    EffectiveGrant:
      type: object
      properties:
        topic_filter: { type: string }
        permission:
          $ref: "#/components/schemas/ACLPermission"
        selector:
          $ref: "#/components/schemas/ACLSelector"
        principal: { type: string }
        denied:
          type: boolean
          description: Whether a deny rule covers the whole topic filter.
        denied_by:
          type: array
          items: { type: string }
      required: [topic_filter, permission, selector, denied]
    EffectiveIdentity:
      type: object
      properties:
        identity:
          type: string
          description: The username of the client, or `anonymous`.
        kind:
          type: string
          enum: [user, anonymous]
        grants:
          type: array
          items: { $ref: "#/components/schemas/EffectiveGrant" }
      required: [identity, kind, grants]
    EffectiveScope:
      type: object
      properties:
        scope:
          $ref: "#/components/schemas/ACLScope"
        listener_id: { type: string }
        path: { type: string }
        identities:
          type: array
          items: { $ref: "#/components/schemas/EffectiveIdentity" }
      required: [scope, path, identities]
    ACLSimulationRequest:
      type: object
      properties:
        scope:
          $ref: "#/components/schemas/ACLScope"
        listener_id:
          type: string
          description: The listener whose ACL file the question is about.
        username:
          type: string
          description: The MQTT username of the client. An empty username is an anonymous client.
        client_id:
          type: string
          description: The client id of the client. It is the value the `%c` placeholder substitutes.
        topic:
          type: string
          description: The topic the client wants to access.
        access:
          type: string
          description: |
            The action the client wants to perform. `read` asks whether the
            client may receive the messages of the topic, `write` asks
            whether it may publish to it.
          enum: [read, write]
      required: [topic, access]
      additionalProperties: false
    ACLSimulationDecision:
      type: object
      properties:
        allowed: { type: boolean }
        reason: { type: string }
        matching_rules:
          type: array
          items: { $ref: "#/components/schemas/ACLRule" }
      required: [allowed, reason]
    JSONSchemaDefinition:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        topic_filter: { type: string }
        schema:
          description: JSON Schema document validating payloads on this topic.
          oneOf:
            - type: object
            - type: array
            - type: string
        description: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, topic_filter, schema, enabled, created_at, updated_at]
    JSONSchemaRequest:
      type: object
      properties:
        name: { type: string }
        topic_filter: { type: string }
        schema:
          oneOf:
            - type: object
            - type: array
        description: { type: string }
        enabled: { type: boolean, default: true }
      required: [name, topic_filter, schema]
      additionalProperties: false
    AuditEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        result: { type: string, enum: [success, failure, unknown] }
        metadata:
          type: object
          additionalProperties: true
      required: [id, occurred_at, actor, action, resource_type, result, metadata]
    SecurityEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        category:
          type: string
          description: |
            Bounded category set: `admin_login_failed`, `admin_login_rate_limited`,
            `protected_api_access_failed`, `protected_api_access_denied`,
            `protected_websocket_access_failed`, `acl_create_failed`,
            `acl_update_failed`, `acl_delete_failed`, `acl_rule_created`,
            `acl_rule_updated`, `acl_rule_deleted`.
        reason: { type: string }
        username: { type: string }
        source_ip: { type: string }
        method: { type: string }
        path: { type: string }
        observed_at: { type: string, format: date-time }
      required: [id, category, reason, observed_at]
    StatusResponse:
      type: object
      properties:
        broker:
          type: object
          properties:
            status: { type: string, enum: [connected, disconnected] }
            observed_at: { type: string, format: date-time }
            target:
              type: object
              properties:
                host: { type: string }
                port: { type: integer }
                address: { type: string }
                tls_enabled: { type: boolean }
              required: [host, port, address, tls_enabled]
            metrics:
              type: object
              properties:
                event_subscribers: { type: integer }
                status_events: { type: integer, format: int64 }
                topic_messages: { type: integer, format: int64 }
                last_message_at: { type: string, format: date-time }
                traffic: { $ref: "#/components/schemas/BrokerTrafficMetrics" }
              required: [event_subscribers, status_events, topic_messages, traffic]
          required: [status, observed_at, target, metrics]
      required: [broker]
    BrokerTrafficMetrics:
      type: object
      properties:
        window_seconds: { type: integer }
        message_count: { type: integer }
        message_rate_per_minute: { type: number, format: double }
        rate_points:
          type: array
          items: { $ref: "#/components/schemas/BrokerRatePoint" }
        top_topics:
          type: array
          items: { $ref: "#/components/schemas/BrokerTrafficItem" }
        top_clients:
          type: array
          items: { $ref: "#/components/schemas/BrokerTrafficItem" }
        top_clients_available: { type: boolean }
        top_clients_note: { type: string }
        persistence: { type: string }
      required: [window_seconds, message_count, message_rate_per_minute, rate_points, top_topics, top_clients_available, top_clients_note, persistence]
    BrokerRatePoint:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        count: { type: integer }
      required: [timestamp, count]
    BrokerTrafficItem:
      type: object
      properties:
        name: { type: string }
        count: { type: integer }
        percentage: { type: number, format: double }
      required: [name, count, percentage]
    BrokerEvent:
      type: object
      description: |
        Single frame emitted on the broker events WebSocket. The exact field set
        depends on `type`:

        - `broker_status` → carries `status` (`connected` / `disconnected`) and `observed_at`.
        - `topic_message` → carries `topic`, `payload_preview`, `payload_format`,
          `payload_bytes`, `truncated`, optional `payload_inspection`, optional
          `schema_validation`, optional `sparkplug`, and `observed_at`.
        - `broker_log` → carries `source`, `severity`, `message`, `observed_at`.
      properties:
        type: { type: string, enum: [broker_status, topic_message, broker_log] }
        status: { type: string, enum: [connected, disconnected] }
        topic: { type: string }
        payload_preview: { type: string }
        payload_format: { type: string, enum: [json, text, binary] }
        payload_bytes: { type: integer }
        truncated: { type: boolean }
        payload_inspection: { $ref: "#/components/schemas/PayloadInspection" }
        schema_validation: { $ref: "#/components/schemas/SchemaValidationResult" }
        sparkplug: { $ref: "#/components/schemas/SparkplugMetadata" }
        source: { type: string }
        severity: { type: string, enum: [debug, info, warning, error] }
        message: { type: string }
        observed_at: { type: string, format: date-time }
      required: [type, observed_at]
    PayloadInspection:
      type: object
      properties:
        detected_type: { type: string, enum: [json_object, json_array, json_scalar, text, binary] }
        byte_length: { type: integer }
        truncated: { type: boolean }
        json_valid: { type: boolean }
        json_top_level_keys:
          type: array
          items: { type: string }
        json_element_count: { type: integer }
        json_scalar_summary: { type: string }
      required: [detected_type, byte_length, truncated, json_valid]
    SchemaValidationResult:
      type: object
      properties:
        schema_id: { type: integer, format: int64 }
        schema_name: { type: string }
        topic_filter: { type: string }
        valid: { type: boolean }
        errors:
          type: array
          items: { type: string }
      required: [schema_id, schema_name, topic_filter, valid]
    MQTTUser:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, username, disabled, created_at, updated_at]
    MQTTUserWithPassword:
      type: object
      description: |
        Returned only on create and reset-password. Surface the cleartext
        exactly once — the server never stores it in this form.
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        password: { type: string, format: password }
      required: [id, username, disabled, created_at, updated_at, password]
    MQTTUserRequest:
      type: object
      properties:
        username: { type: string, minLength: 1 }
      required: [username]
      additionalProperties: false
    MQTTUserUpdateRequest:
      type: object
      properties:
        username: { type: string, minLength: 1 }
        disabled: { type: boolean }
      additionalProperties: false
    Deployment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actor: { type: string }
        status: { type: string }
        message: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, actor, status, created_at, updated_at]
    DeploymentPreview:
      type: object
      properties:
        revision_id: { type: string }
        base_acl_hash: { type: string }
        base_passwd_hash: { type: string }
        rendered_acl_hash: { type: string }
        rendered_passwd_hash: { type: string }
        orphan_rules:
          type: array
          items: { $ref: "#/components/schemas/ACLRule" }
        has_changes: { type: boolean }
        acl_diff: { type: string }
        passwd_diff: { type: string }
        acl_body: { type: string }
        scope_issues:
          type: array
          description: |
            Configuration problems that leave the listener-scoped rules
            without effect. They block the apply.
          items: { type: string }
        scope_pending_activation:
          type: array
          description: |
            Scoped rules that the apply writes but that the broker reads
            only once the broker configuration declares the file of the
            listener. The rules are active after the listener configuration
            is applied.
          items: { type: string }
        listener_acl_files:
          type: array
          description: The per-listener ACL files the apply would write.
          items: { $ref: "#/components/schemas/ListenerACLPreview" }
        removed_acl_files:
          type: array
          description: The per-listener ACL files the apply would delete.
          items: { type: string }
        summary: { $ref: "#/components/schemas/DeploymentChangeSummary" }
      required: [revision_id, base_acl_hash, base_passwd_hash, rendered_acl_hash, rendered_passwd_hash, orphan_rules, has_changes, acl_diff, passwd_diff, acl_body, summary]
    ListenerACLPreview:
      type: object
      properties:
        listener_id: { type: string }
        path: { type: string }
        body: { type: string }
        diff: { type: string }
        at_risk_entries:
          type: array
          items: { type: string }
        preserved_entries:
          type: array
          items: { type: string }
    DeploymentChangeSummary:
      type: object
      properties:
        users_added: { type: integer }
        users_removed: { type: integer }
        users_rotated: { type: integer }
        has_passwd_changes: { type: boolean }
        topics_added: { type: integer }
        topics_removed: { type: integer }
        has_acl_changes: { type: boolean }
      required: [users_added, users_removed, users_rotated, has_passwd_changes, topics_added, topics_removed, has_acl_changes]
    DeploymentApplyRequest:
      type: object
      properties:
        revision_id: { type: string, minLength: 1 }
      required: [revision_id]
      additionalProperties: false
    ListenerPreviewRequest:
      type: object
      properties:
        specs:
          type: array
          items: { $ref: "#/components/schemas/ListenerSpec" }
        confirm: { type: boolean }
      required: [specs]
    ListenerSpec:
      type: object
      properties:
        ID: { type: string }
        Port: { type: integer }
        Bind: { type: string }
        Protocols:
          type: [array, "null"]
          items: { type: string, enum: [mqtt, websockets] }
        Options:
          type: [object, "null"]
          additionalProperties: { type: string }
        tls_profile:
          type: string
          description: |
            Name of the certificate profile that secures the listener. Empty
            when the listener serves plain MQTT. The broker-side paths of
            the profile are injected at render time, so a rotation does not
            change the rendered configuration.
        RestartNeeded: { type: boolean }
      required: [ID, Port, Bind, Protocols, Options, RestartNeeded]
    ListenerSpecRow:
      allOf:
        - $ref: "#/components/schemas/ListenerSpec"
        - type: object
          properties:
            CreatedAt: { type: string, format: date-time }
            UpdatedAt: { type: string, format: date-time }
          required: [CreatedAt, UpdatedAt]
    ListenerPreviewResult:
      type: object
      properties:
        revision_id: { type: string }
        base_hash: { type: string }
        rendered_hash: { type: string }
        needs_restart: { type: boolean }
        diff: { type: string }
        rendered: { type: string }
        issues:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/ListenerIssue" }
        warnings:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/ListenerOptionWarning" }
        compose_status: { $ref: "#/components/schemas/ComposePreviewStatus" }
        created_at: { type: string, format: date-time }
      required: [revision_id, base_hash, rendered_hash, needs_restart, diff, rendered, issues, warnings, compose_status, created_at]
    ListenerIssue:
      type: object
      properties:
        Kind: { type: string }
        ListenerID: { type: string }
        Directive: { type: string }
        Message: { type: string }
      required: [Kind, ListenerID, Directive, Message]
    ListenerOptionWarning:
      type: object
      properties:
        Kind: { type: string }
        ListenerID: { type: string }
        Key: { type: string }
        Message: { type: string }
      required: [Kind, ListenerID, Key, Message]
    ComposePreviewStatus:
      type: object
      properties:
        compose_path: { type: string }
        mapped_ports:
          type: array
          items: { type: integer }
        unmapped_ports:
          type: array
          items: { type: integer }
        disabled: { type: boolean }
      required: [compose_path, mapped_ports, unmapped_ports, disabled]
    ListenerApplyRequest:
      type: object
      properties:
        revision_id: { type: string }
        confirm: { type: boolean }
      required: [revision_id, confirm]
    ListenerApplyResult:
      type: object
      properties:
        revision_id: { type: string }
        applied: { type: boolean }
      required: [revision_id, applied]
      additionalProperties: false
    CertificateIssue:
      type: object
      description: A validation problem or a warning about the uploaded material.
      properties:
        kind: { type: string }
        field: { type: string }
        message: { type: string }
      required: [kind, field, message]
    CertificateRevisionRequest:
      type: object
      description: |
        The uploaded certificate material. The private key is write-only: MCM
        stores it on disk and never returns it.
      properties:
        ca_cert_pem: { type: string, description: "PEM encoded certificate authority." }
        server_cert_pem: { type: string, description: "PEM encoded server certificate." }
        server_key_pem: { type: string, description: "PEM encoded server private key. Write-only." }
        chain_pem: { type: string, description: "Optional PEM encoded intermediate chain." }
        expected_names:
          type: array
          description: Names the server certificate must cover.
          items: { type: string }
        description: { type: string }
        require_ca: { type: boolean, description: "Reject the upload when no certificate authority is supplied." }
      required: [server_cert_pem, server_key_pem]
    CertificateRevision:
      type: object
      description: Public metadata of a certificate revision. It never carries private key material.
      properties:
        revision_id: { type: string }
        state: { type: string, description: "pending, active, superseded or failed." }
        actor: { type: string }
        material_hash: { type: string }
        subject: { type: string }
        issuer: { type: string }
        dns_names:
          type: array
          items: { type: string }
        ip_addresses:
          type: array
          items: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        fingerprint_sha256: { type: string }
        key_algorithm: { type: string }
        is_ca: { type: boolean }
        has_ca: { type: boolean }
        has_chain: { type: boolean }
        serial_number: { type: string }
        expiry_status: { type: string, description: "valid, expiring, expired or unknown." }
        failure_reason: { type: string }
        created_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time }
        issues:
          type: array
          items: { $ref: "#/components/schemas/CertificateIssue" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/CertificateIssue" }
      required: [revision_id, state, material_hash, expiry_status]
    CertificateProfile:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        active_revision: { type: string }
        expiry_status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        revisions:
          type: array
          items: { $ref: "#/components/schemas/CertificateRevision" }
      required: [name, expiry_status, revisions]
    CertificateActionRequest:
      type: object
      properties:
        profile: { type: string }
        revision_id: { type: string }
      required: [profile, revision_id]
    CertificateFiles:
      type: object
      description: Broker-side paths of the active material. The paths are stable across rotations.
      properties:
        ca_path: { type: string }
        cert_path: { type: string }
        key_path: { type: string }
        chain_path: { type: string }
      required: [ca_path, cert_path, key_path, chain_path]
    CertificatePreview:
      type: object
      properties:
        profile: { type: string }
        revision_id: { type: string }
        current_revision: { type: string }
        subject: { type: string }
        issuer: { type: string }
        dns_names:
          type: array
          items: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        fingerprint_sha256: { type: string }
        expiry_status: { type: string }
        files: { $ref: "#/components/schemas/CertificateFiles" }
        restart_required: { type: boolean }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/CertificateIssue" }
      required: [profile, revision_id, expiry_status, files, restart_required]
    CertificateVerification:
      type: object
      description: |
        The outcome of one TLS handshake check. `unverified` means the check
        could not be completed, for example because MCM cannot reach the port
        or because the listener demands a client certificate.
      properties:
        listener_id: { type: string }
        port: { type: integer }
        status: { type: string, description: "verified, unverified or failed." }
        reason: { type: string }
        detail: { type: string }
      required: [port, status]
    CertificateApplyResult:
      type: object
      properties:
        profile: { type: string }
        revision_id: { type: string }
        previous_revision: { type: string }
        restarted: { type: boolean }
        recovered: { type: boolean, description: "True when a failed activation restored the previous material." }
        recovery_note: { type: string }
        verification:
          type: array
          items: { $ref: "#/components/schemas/CertificateVerification" }
      required: [profile, revision_id, restarted, recovered, verification]
    CertificateApplyFailure:
      type: object
      description: |
        The activation failed. The previous material was restored and the broker
        restarted again; `result` carries the same state as a successful
        activation, with the failed revision and the reason.
      properties:
        error: { type: string }
        detail: { type: string }
        result: { $ref: "#/components/schemas/CertificateApplyResult" }
      required: [error, result]
    CertificateValidationError:
      type: object
      properties:
        error: { type: string }
        issues:
          type: array
          items: { $ref: "#/components/schemas/CertificateIssue" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/CertificateIssue" }
      required: [error, issues]
    BrokerConfig:
      type: object
      description: |
        Current on-disk `mosquitto.conf` plus its sha256 fingerprint. The
        `path` field is the absolute path MCM was wired to manage.
      properties:
        path: { type: string }
        body: { type: string }
        hash: { type: string, description: "hex-encoded sha256 of `body`" }
      required: [path, body, hash]
    BrokerConfigImportRequest:
      type: object
      description: |
        Optional body for `/import` and `/preview`. The `path` field is
        accepted for forward-compatibility; today MCM only manages the path
        it was wired with via `WithBrokerConfig`, so the field is ignored.
      properties:
        path: { type: string }
      additionalProperties: false
    BrokerConfigPreview:
      type: object
      description: |
        Output of `POST /api/v1/broker/config/{import,preview}`. Includes the
        rendered conf body, the unified diff against the on-disk file, and
        the catalog-driven classification that the apply path consumes.
      properties:
        revision_id: { type: string }
        base_conf_hash: { type: string }
        rendered_conf_hash: { type: string }
        conf_diff: { type: string }
        conf_body: { type: string }
        reload_kind: { type: string, enum: [reload, restart, both] }
        requires_restart: { type: boolean }
        validation_issues:
          type: array
          items: { $ref: "#/components/schemas/BrokerConfigValidationIssue" }
        include_snapshot: { $ref: "#/components/schemas/BrokerConfigIncludeSnapshot" }
        has_changes: { type: boolean }
      required:
        [revision_id, base_conf_hash, rendered_conf_hash, conf_diff, conf_body, reload_kind, requires_restart, validation_issues, has_changes]
    BrokerConfigValidationIssue:
      type: object
      properties:
        kind: { type: string, description: "unknown | type | scope | multiplicity | dependency | since_version" }
        line: { type: integer }
        directive: { type: string }
        message: { type: string }
      required: [kind, line, directive, message]
    BrokerConfigIncludeSnapshot:
      type: object
      properties:
        root: { type: string }
        files:
          type: array
          items: { $ref: "#/components/schemas/BrokerConfigIncludeFileEntry" }
      required: [root, files]
    BrokerConfigIncludeFileEntry:
      type: object
      properties:
        path: { type: string, description: "path relative to include_snapshot.root" }
        size: { type: integer, format: int64 }
        sha256: { type: string }
      required: [path, size, sha256]
    BrokerConfigAdoption:
      type: object
      properties:
        id: { type: integer, format: int64 }
        source_path: { type: string }
        adopted_by: { type: string }
        adopted_at: { type: string, format: date-time }
      required: [id, source_path, adopted_by, adopted_at]
    BrokerConfigApplyRequest:
      type: object
      properties:
        revision_id: { type: string, minLength: 1 }
        force: { type: boolean, description: "Apply even when the diff contains restart-required directives." }
        adopt: { type: boolean, description: "Record an adoption in the same call so the apply can proceed." }
      required: [revision_id]
      additionalProperties: false
    CatalogResponse:
      type: object
      properties:
        version: { type: string, description: "Mosquitto version this catalog describes." }
        directives:
          type: array
          items: { $ref: "#/components/schemas/DirectiveSpec" }
      required: [version, directives]
    DirectiveSpec:
      type: object
      properties:
        name: { type: string }
        type: { type: string, enum: [string, integer, boolean, enum, string_list, path, duration] }
        scope: { type: string, enum: [global, listener, bridge, any] }
        multiplicity: { type: string, enum: [once, many, once_per_block] }
        reload_kind: { type: string, enum: [reload, restart, both] }
        since_version: { type: string }
        listener_since_version: { type: string }
        allowed_values:
          type: array
          items: { type: string }
        deps:
          type: array
          items: { type: string }
        description: { type: string }
        section:
          type: string
          enum: [persistence, queues, sessions, logging]
          description: |
            Settings form the directive belongs to. Absent when the directive
            is not exposed as an editable field.
        unit: { type: string, description: "Unit of an integer value, e.g. seconds or bytes." }
        min: { type: integer, format: int64, description: "Lowest accepted value." }
        max: { type: integer, format: int64, description: "Highest accepted value." }
        default: { type: string, description: "Broker default, shown as help text." }
        duration_suffixes:
          type: array
          items: { type: string }
          description: "Unit suffixes a duration directive accepts in this broker version."
      required: [name, type, scope, multiplicity, reload_kind, since_version]
    BrokerSettingsResponse:
      type: object
      properties:
        path: { type: string, description: "Absolute path of the configuration file MCM manages." }
        hash: { type: string, description: "sha256 of the on-disk configuration." }
        version: { type: string, description: "Mosquitto version the catalog describes." }
        document: { $ref: "#/components/schemas/BrokerSettingsDocument" }
        sections:
          type: array
          items: { $ref: "#/components/schemas/BrokerSettingsSection" }
        warnings:
          type: array
          items: { type: string }
          description: "Settings that are also set in an included file."
      required: [path, hash, version, document, sections]
    BrokerSettingsDocument:
      type: object
      description: |
        The state of every setting MCM manages. A repeatable directive such as
        `log_dest` appears once per occurrence. An entry marked `unset` is
        written without a value, which means the broker default applies.
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/BrokerSettingsEntry" }
      required: [entries]
    BrokerSettingsEntry:
      type: object
      properties:
        directive: { type: string }
        values:
          type: array
          items: { type: string }
        unset: { type: boolean, description: "The broker default applies; the directive is removed from the file." }
      required: [directive]
    BrokerSettingsSection:
      type: object
      properties:
        id: { type: string, enum: [persistence, queues, sessions, logging] }
        title: { type: string }
        hint: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/BrokerSettingsField" }
      required: [id, title, fields]
    BrokerSettingsField:
      type: object
      description: |
        One editable field. Everything the form needs comes from the catalog,
        so the UI never hard-codes a range or a unit.
      properties:
        directive: { type: string }
        section: { type: string, enum: [persistence, queues, sessions, logging] }
        type: { type: string, enum: [string, integer, boolean, enum, string_list, path, duration] }
        unit: { type: string }
        min: { type: integer, format: int64 }
        max: { type: integer, format: int64 }
        default: { type: string }
        multiplicity: { type: string, enum: [once, many, once_per_block] }
        reload_kind: { type: string, enum: [reload, restart, both] }
        scope: { type: string, enum: [global, listener, bridge, any] }
        allowed_values:
          type: array
          items: { type: string }
        duration_suffixes:
          type: array
          items: { type: string }
        description: { type: string }
        present: { type: boolean, description: "The configuration file sets this directive." }
        values:
          type: array
          items: { type: string }
      required: [directive, section, type, multiplicity, reload_kind, scope, description, present]
    BrokerSettingsIssue:
      type: object
      properties:
        kind: { type: string, enum: [unknown, type, range, multiplicity, duplicate, conflict] }
        directive: { type: string }
        message: { type: string }
      required: [kind, directive, message]
    BrokerSettingsError:
      type: object
      properties:
        error: { type: string }
        issues:
          type: array
          items: { $ref: "#/components/schemas/BrokerSettingsIssue" }
      required: [error, issues]
    BridgeListResponse:
      type: object
      description: |
        The bridge connections declared in the managed `mosquitto.conf`.
      properties:
        bridges:
          type: array
          items: { $ref: "#/components/schemas/Bridge" }
      required: [bridges]
    BridgeDocumentRequest:
      type: object
      description: |
        The complete set of bridges the operator wants. The connection
        sections of the managed configuration are replaced with them; every
        other part of the file is preserved.
      properties:
        bridges:
          type: array
          items: { $ref: "#/components/schemas/Bridge" }
      required: [bridges]
    Bridge:
      type: object
      description: |
        One bridge connection. The credential fields are write-only: the API
        never returns them, it reports `password_set` and `psk_set` instead.
        A password the client does not send keeps the value it has on disk.
      properties:
        name:
          type: string
          description: "Connection name. Unique in the file; letters, digits, dots, dashes and underscores."
        address:
          type: string
          description: "Address of the remote broker as host or host:port."
        remote_client_id: { type: string, description: "Client id the bridge uses on the remote broker." }
        local_client_id: { type: string, description: "Client id the bridge uses on the local broker." }
        username: { type: string, description: "User name the bridge authenticates with on the remote broker." }
        password:
          type: string
          writeOnly: true
          description: "Password the bridge authenticates with on the remote broker. Never returned."
        password_set: { type: boolean, description: "A remote password is configured." }
        local_username: { type: string, description: "User name the bridge authenticates with on the local broker." }
        local_password:
          type: string
          writeOnly: true
          description: "Password the bridge authenticates with on the local broker. Never returned."
        local_password_set: { type: boolean, description: "A local password is configured." }
        protocol_version: { type: string, enum: [mqttv31, mqttv311, mqttv50] }
        clean_session: { type: boolean }
        local_clean_session: { type: boolean }
        keepalive_seconds: { type: integer, minimum: 5, maximum: 65535 }
        restart_timeout:
          type: string
          description: "Reconnection backoff: a number of seconds or a base and cap pair such as '5 30'."
        notifications: { type: boolean }
        notifications_local_only: { type: boolean }
        notification_topic: { type: string }
        try_private: { type: boolean }
        start_type: { type: string, enum: [automatic, lazy, once] }
        threshold: { type: integer, minimum: 1 }
        idle_timeout_seconds: { type: integer, minimum: 0 }
        round_robin: { type: boolean }
        tls: { $ref: "#/components/schemas/BridgeTLSOptions" }
        topics:
          type: array
          items: { $ref: "#/components/schemas/BridgeTopicRule" }
      required: [name, address, topics]
    BridgeTLSOptions:
      type: object
      description: |
        The transport security of a bridge connection. Every field maps to a
        `bridge_*` directive.
      properties:
        ca_file: { type: string, description: "CA certificate file used to verify the remote broker." }
        ca_path: { type: string, description: "Directory of CA certificates used to verify the remote broker." }
        cert_file: { type: string, description: "Client certificate presented to the remote broker. Requires key_file." }
        key_file: { type: string, description: "Private key of the client certificate. Requires cert_file." }
        insecure: { type: boolean, description: "Skip the verification of the certificate of the remote broker." }
        tls_version: { type: string, enum: [tlsv1.2, tlsv1.3] }
        alpn: { type: string }
        psk:
          type: string
          writeOnly: true
          description: "Pre-shared key used instead of a certificate. Never returned."
        psk_set: { type: boolean, description: "A pre-shared key is configured." }
        identity: { type: string, description: "Identity of the pre-shared key." }
        require_ocsp: { type: boolean }
        outgoing_retain: { type: boolean }
        max_packet_size: { type: integer, minimum: 0 }
    BridgeTopicRule:
      type: object
      description: |
        One topic the bridge forwards. The direction defaults to `both`, the
        quality of service to 0.
      properties:
        topic: { type: string, description: "MQTT topic pattern the bridge forwards." }
        direction: { type: string, enum: [in, out, both] }
        qos: { type: integer, minimum: 0, maximum: 2 }
        local_prefix: { type: string, description: "Prefix added to the topic on the local broker." }
        remote_prefix: { type: string, description: "Prefix added to the topic on the remote broker." }
      required: [topic, qos]
    BridgeValidationIssue:
      type: object
      properties:
        kind: { type: string, enum: [name, address, duplicate, dependency, loop, value, secret] }
        severity: { type: string, enum: [error, warning], description: "An error refuses the preview; a warning is advisory." }
        bridge: { type: string, description: "Name of the bridge the finding belongs to." }
        field: { type: string, description: "Field of the bridge the finding belongs to." }
        topic: { type: string, description: "Topic rule the finding belongs to." }
        message: { type: string }
      required: [kind, message]
    BridgeValidationError:
      type: object
      properties:
        error: { type: string }
        issues:
          type: array
          items: { $ref: "#/components/schemas/BridgeValidationIssue" }
      required: [error, issues]
    SettingsResponse:
      type: object
      properties:
        http:
          type: object
          properties:
            bind_address: { type: string }
            port: { type: integer }
            tls_enabled: { type: boolean }
          required: [bind_address, port, tls_enabled]
        mosquitto:
          type: object
          properties:
            host: { type: string }
            port: { type: integer }
            protocol: { type: string, enum: [mqtt, mqtts] }
          required: [host, port, protocol]
        deploy:
          type: object
          properties:
            mode: { type: string }
          required: [mode]
      required: [http, mosquitto, deploy]
    SparkplugMetadata:
      type: object
      properties:
        namespace: { type: string }
        group_id: { type: string }
        message_type: { type: string }
        edge_node_id: { type: string }
        device_id: { type: string }
      required: [namespace, group_id, message_type, edge_node_id]
