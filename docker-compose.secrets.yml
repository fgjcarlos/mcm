# Secrets-only override for the MCM Docker Compose stack.
#
# Why this file exists (issue #274): the dev `docker-compose.yml` no
# longer requires MCM_AUTH_JWT_SECRET or MCM_BOOTSTRAP_ADMIN_PASSWORD
# because the Go runtime auto-generates them on first boot. That keeps
# the bare `task build && task up` flow working on a clean clone, but
# production deployments must NOT rely on auto-generated credentials —
# the operator needs control over the JWT secret and the bootstrap
# admin password.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# Both `MCM_AUTH_JWT_SECRET` and `MCM_BOOTSTRAP_ADMIN_PASSWORD` must be
# set in the shell (or a `.env` file ignored by git) before invoking
# compose, otherwise compose will refuse to start with the same
# `:?required` error the dev compose used to raise.
#
# IMPORTANT: this file is a SECRETS-ONLY override. It does NOT make the
# resulting stack production-ready on its own. The dev compose it
# layers on top of still:
#   - exposes Mosquitto's plaintext MQTT (1883) and WebSocket (9001)
#     ports on the host;
#   - publishes MCM's HTTP API on host port 8080 without TLS;
#   - uses the development Mosquitto conf (anonymous + plain TCP).
# For production, also apply the TLS / auth / network hardening from
# deploy/mosquitto/README.md and the production deployment checklist in
# deploy/mcm/README.md. The intended use is "operator-controlled
# secrets + dev-friendly defaults, until you switch the relevant
# overrides too."
#
# See deploy/mcm/README.md for the broader prod deployment guide.
services:
  mcm:
    environment:
      MCM_AUTH_JWT_SECRET: "${MCM_AUTH_JWT_SECRET:?required}"
      MCM_BOOTSTRAP_ADMIN_PASSWORD: "${MCM_BOOTSTRAP_ADMIN_PASSWORD:?required}"
