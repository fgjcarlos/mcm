name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly vulnerability scan — surfaces new CVEs in existing deps.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: npm ci
        run: npm --prefix frontend ci
      - name: npm run build
        run: npm --prefix frontend run build
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -race -count=1

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v6
        with:
          # `install-mode: goinstall` compiles golangci-lint from source using the
          # runner's Go toolchain (1.25.11 from go.mod). This avoids the upstream
          # binary's toolchain version being older than the project's target Go
          # version (a hard requirement of golangci-lint: it refuses to load
          # configs targeting a Go version higher than the one used to build
          # the linter binary).
          #
          # Pinned to v2.0.0, the lowest v2.x release, because:
          # - v1.64.8 (the last v1.x) was built with Go 1.24 and refuses configs
          #   targeting 1.25.x.
          # - the v2.x binary releases on GitHub also lag the current Go releases
          #   and hit the same toolchain-mismatch error.
          # - the v2 config schema (.golangci.yml) has been stable since v2.0.0;
          #   building from source against `version: v2.0.0` keeps the action
          #   deterministic while compiling with the runner's Go 1.25.11.
          install-mode: goinstall
          version: v2.0.0

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  backend-build:
    name: Backend build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: npm ci
        run: npm --prefix frontend ci
      - name: npm run build
        run: npm --prefix frontend run build
      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  docker-build:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build MCM image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mcm:ci

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm run lint
        run: npm run lint
      - name: npm run test:run
        run: npm run test:run
      - name: npm run build
        run: npm run build

  goreleaser-check:
    name: GoReleaser config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  openapi:
    name: OpenAPI spec lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: redocly lint
        run: npx -y @redocly/cli@latest lint docs/openapi.yaml
