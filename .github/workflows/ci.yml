name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Single image-driven job for the Docker-first pivot (#230). Builds the
# image, smoke-runs it, then exercises Go, frontend, OpenAPI, and the
# Astro site. No matrix, no GoReleaser, no separate lint jobs — every
# check is a step.
jobs:
  image:
    name: Image build + smoke + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            site/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # --- Image build + smoke ----------------------------------------------------
      - name: docker buildx build
        run: docker buildx build --load -t mcm:dev .

      # Smoke run: build the image, mount a minimal valid YAML so the
      # binary's --config flag resolves, and supply the secrets + bootstrap
      # admin via env vars. The server-only binary (post #235/#238) takes
      # --config directly with no subcommands; #231 will simplify the
      # Dockerfile default entrypoint, after which this step can drop the
      # --config override.
      - name: write smoke config
        run: |
          cat > /tmp/mcm-smoke.yaml <<'EOF'
          http:
            bind_address: 0.0.0.0
            port: 8080
          database:
            path: /var/lib/mcm/mcm.db
          mosquitto:
            host: 127.0.0.1
            port: 1883
          auth:
            token_ttl: 24h
          logging:
            level: info
            format: json
          EOF

      - name: docker run (smoke)
        run: |
          docker run -d --name mcm-smoke -p 8080:8080 \
            -v /tmp/mcm-smoke.yaml:/etc/mcm/config.yaml:ro \
            -e MCM_AUTH_JWT_SECRET=ci-smoke-jwt-secret-at-least-32-chars-long \
            -e MCM_BOOTSTRAP_ADMIN_USERNAME=ci-admin \
            -e MCM_BOOTSTRAP_ADMIN_PASSWORD=ci-admin-password-1234 \
            mcm:dev --config /etc/mcm/config.yaml

      - name: wait 5s
        run: sleep 5

      - name: curl /livez
        run: curl -fsS http://localhost:8080/livez

      - name: curl /healthz (alias)
        run: curl -fsS http://localhost:8080/healthz

      # /readyz requires the broker to be reachable. The CI smoke container
      # does NOT run a Mosquitto sidecar, so we expect 503 ("not_ready",
      # error="broker unavailable") and verify the response body. Post-#255
      # the readiness handler checks both SQLite and the broker snapshot;
      # this curl exercises the broker-unreachable path of that new logic.
      - name: curl /readyz (expects 503 in smoke — no Mosquitto)
        run: |
          code=$(curl -sS -o /tmp/readyz.json -w "%{http_code}" http://localhost:8080/readyz)
          if [ "$code" != "503" ]; then
            echo "Expected 503 from /readyz in smoke (no broker running), got $code"
            cat /tmp/readyz.json
            exit 1
          fi
          cat /tmp/readyz.json
          echo
          if ! grep -q '"broker unavailable"' /tmp/readyz.json; then
            echo "Expected /readyz body to report broker unavailable"
            cat /tmp/readyz.json
            exit 1
          fi
          echo "broker-unreachable path confirmed"

      - name: docker stop+rm
        run: |
          docker stop mcm-smoke
          docker rm mcm-smoke

      # --- E2E deploy artifact -----------------------------------------------------
      # The e2e-deploy job below reuses the mcm:dev image built above.
      # We `docker save` it and upload as an artifact so the dependent job
      # can `docker load` without rebuilding (which would otherwise
      # double the CI time for the frontend build).
      - name: docker save (for e2e job)
        run: docker save mcm:dev -o /tmp/mcm-dev.tar

      - name: upload e2e image artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcm-dev-image
          path: /tmp/mcm-dev.tar
          retention-days: 1

      # --- Go ---------------------------------------------------------------------
      - name: go test
        run: go test ./... -race -count=1

      - name: go vet
        run: go vet ./...

      - name: gofmt -l .
        # Must produce no output: every Go file is formatted.
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout 5m

      # --- Frontend ---------------------------------------------------------------
      - name: npm ci (frontend)
        run: npm --prefix frontend ci

      - name: npm run build (frontend)
        run: npm --prefix frontend run build

      - name: npm run lint (frontend)
        run: npm --prefix frontend run lint

      - name: npm run test:run (frontend)
        run: npm --prefix frontend run test:run

      # --- OpenAPI ----------------------------------------------------------------
      - name: redocly lint
        run: npx -y @redocly/cli@latest lint docs/openapi.yaml

      # --- Astro site -------------------------------------------------------------
      - name: npm ci (site)
        run: npm --prefix site ci

      - name: npm run build (site)
        run: npm --prefix site run build

  # E2E deploy flow for #275. Boots the dev Compose stack (MCM +
  # Mosquitto), exercises the full deploy API path, and asserts the
  # broker accepts an allowed publish and silently drops a forbidden
  # one. The job depends on `image` and reuses the mcm:dev image via
  # the artifact uploaded above so we do not rebuild the frontend in
  # a second job.
  e2e-deploy:
    name: E2E deploy flow against live Mosquitto
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: download mcm:dev image artifact
        uses: actions/download-artifact@v4
        with:
          name: mcm-dev-image
          path: /tmp/mcm-dev.tar

      - name: docker load (mcm:dev)
        run: docker load -i /tmp/mcm-dev.tar

      - name: scripts/e2e-deploy.sh
        # Issue #275 acceptance criteria: prove the full MCM UI/API →
        # Mosquitto deploy path on a live broker. The script asserts
        # preview, apply, allowed-topic deliver, and forbidden-topic
        # drop — see scripts/e2e-deploy.sh for the per-step invariants.
        run: bash scripts/e2e-deploy.sh