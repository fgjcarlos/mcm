name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly vulnerability scan — surfaces new CVEs in existing deps.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: npm ci
        run: npm --prefix frontend ci
      - name: npm run build
        run: npm --prefix frontend run build
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -race -count=1

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v6
        with:
          # Pinned to v2.12.2, built with Go 1.26.2, so it loads the v2-schema
          # .golangci.yml and is higher than the project's target Go version
          # (1.25.11 from go.mod) — golangci-lint requires the binary's build
          # Go to be >= the target Go.
          #
          # Note: an earlier attempt used `install-mode: goinstall` with
          # `version: v2.0.0`, which the action translates to
          # `go install github.com/golangci/golangci-lint/cmd/golangci-lint@v2.0.0`.
          # The v2 module path is `.../golangci-lint/v2/cmd/golangci-lint`, so
          # `go install` failed with `unknown revision cmd/golangci-lint/v2.0.0`.
          # Using the prebuilt binary avoids that whole class of path issues.
          version: v2.12.2

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  backend-build:
    name: Backend build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: npm ci
        run: npm --prefix frontend ci
      - name: npm run build
        run: npm --prefix frontend run build
      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  docker-build:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build MCM image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mcm:ci

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm run lint
        run: npm run lint
      - name: npm run test:run
        run: npm run test:run
      - name: npm run build
        run: npm run build

  goreleaser-check:
    name: GoReleaser config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  openapi:
    name: OpenAPI spec lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: redocly lint
        run: npx -y @redocly/cli@latest lint docs/openapi.yaml
