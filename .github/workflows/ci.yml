name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Single image-driven job for the Docker-first pivot (#230). Builds the
# image, smoke-runs it, then exercises Go, frontend, OpenAPI, and the
# Astro site. No matrix, no GoReleaser, no separate lint jobs — every
# check is a step.
jobs:
  image:
    name: Image build + smoke + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            site/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # --- Image build + smoke ----------------------------------------------------
      - name: docker buildx build
        run: docker buildx build --load -t mcm:dev .

      - name: docker run (smoke)
        run: docker run -d --name mcm-smoke -p 8080:8080 mcm:dev

      - name: wait 5s
        run: sleep 5

      - name: curl /healthz
        run: curl -fsS http://localhost:8080/healthz

      - name: curl /readyz
        run: curl -fsS http://localhost:8080/readyz

      - name: docker stop+rm
        run: |
          docker stop mcm-smoke
          docker rm mcm-smoke

      # --- Go ---------------------------------------------------------------------
      - name: go test
        run: go test ./... -race -count=1

      - name: go vet
        run: go vet ./...

      - name: gofmt -l .
        # Must produce no output: every Go file is formatted.
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Unformatted files:"
            echo "$out"
            exit 1
          fi

      # --- Frontend ---------------------------------------------------------------
      - name: npm ci (frontend)
        run: npm --prefix frontend ci

      - name: npm run build (frontend)
        run: npm --prefix frontend run build

      - name: npm run lint (frontend)
        run: npm --prefix frontend run lint

      - name: npm run test:run (frontend)
        run: npm --prefix frontend run test:run

      # --- OpenAPI ----------------------------------------------------------------
      - name: redocly lint
        run: npx -y @redocly/cli@latest lint docs/openapi.yaml

      # --- Astro site -------------------------------------------------------------
      - name: npm ci (site)
        run: npm --prefix site ci

      - name: npm run build (site)
        run: npm --prefix site run build