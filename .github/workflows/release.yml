name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: build + push multi-arch + create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute build metadata
        id: meta
        run: |
          echo "COMMIT=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # ponytail: docker/build-push-action v6 only exposes imageid/digest/metadata.
      # SBOM is published as an OCI attestation, not a writable file path. To attach
      # a real SPDX file we generate one with syft in a sidecar step and upload it
      # as a release asset — keeps the SBOM promise honest. Upgrade path: replace
      # syft with an in-build SBOM step (buildx 0.13+) once the CI image pins it.
      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mcm:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/mcm:latest
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ steps.meta.outputs.COMMIT }}
            BUILD_DATE=${{ steps.meta.outputs.BUILD_DATE }}

      - name: Generate SPDX SBOM
        id: sbom
        run: |
          mkdir -p artifacts
          # Resolve the digest-tagged ref (digest output is sha256:...; we pull the
          # tag for a stable ref syft can resolve locally).
          docker pull ghcr.io/${{ github.repository_owner }}/mcm:${{ steps.version.outputs.VERSION }} >> /dev/null
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/artifacts:/out" \
            anchore/syft:latest \
            packages \
            -o spdx-json=/out/sbom.spdx.json \
            ghcr.io/${{ github.repository_owner }}/mcm:${{ steps.version.outputs.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/sbom.spdx.json
          body: |
            ## Docker images

            Pull by tag (recommended for production):

            ```
            docker pull ghcr.io/${{ github.repository_owner }}/mcm:${{ steps.version.outputs.VERSION }}
            ```

            The multi-arch manifest covers `linux/amd64` and `linux/arm64`.

            ### Build metadata

            - **Manifest digest**: `${{ steps.build.outputs.digest }}`
            - **Image**: `ghcr.io/${{ github.repository_owner }}/mcm:${{ steps.version.outputs.VERSION }}`
            - **Commit**: `${{ steps.meta.outputs.COMMIT }}`
            - **Built at**: `${{ steps.meta.outputs.BUILD_DATE }}`

            ### Provenance and SBOM

            The image was built with `docker buildx` provenance + SBOM attestations
            (`--provenance=true --sbom=true`). Inspect OCI attestations with:

            ```
            docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/mcm:${{ steps.version.outputs.VERSION }} --raw
            ```

            A standalone SPDX-JSON SBOM is attached as a release asset
            (`sbom.spdx.json`). Verify with:

            ```
            cosign verify-attestation --type spdxjson --certificate-identity-regexp '.*' \
              ghcr.io/${{ github.repository_owner }}/mcm:${{ steps.version.outputs.VERSION }}
            ```
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
