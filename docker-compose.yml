services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mcm-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./deploy/mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
      # - ./deploy/mosquitto/certs:/mosquitto/certs:ro  # required when enabling the TLS listener
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t mcm/healthcheck -m ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mcm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcm-server
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - mcm_data:/var/lib/mcm
    # Inject secrets at runtime via env. MCM_AUTH_JWT_SECRET and
    # MCM_BOOTSTRAP_ADMIN_PASSWORD must be supplied (use a .env file or
    # the orchestrator's secret store). MCM_BOOTSTRAP_ADMIN_USERNAME
    # defaults to "admin" when unset. Other fields come from
    # internal/config.Default() and may be overridden with MCM_* env
    # vars (MCM_HTTP_PORT, MCM_DATABASE_PATH, MCM_MOSQUITTO_HOST, etc.).
    environment:
      MCM_AUTH_JWT_SECRET: "${MCM_AUTH_JWT_SECRET:?required}"
      MCM_BOOTSTRAP_ADMIN_USERNAME: "${MCM_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      MCM_BOOTSTRAP_ADMIN_PASSWORD: "${MCM_BOOTSTRAP_ADMIN_PASSWORD:?required}"
      MCM_MOSQUITTO_HOST: mosquitto
      MCM_HTTP_BIND_ADDRESS: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/livez || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  mosquitto_data:
  mosquitto_logs:
  mcm_data:
