services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mcm-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./deploy/mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t mcm/healthcheck -m ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mcm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcm-server
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/mcm/config.yaml:/etc/mcm/config.yaml:ro
      - mcm_data:/var/lib/mcm
    environment:
      MCM_LOG_FORMAT: json
    healthcheck:
      test: ["CMD", "mcm", "doctor", "--config", "/etc/mcm/config.yaml"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mosquitto_data:
  mosquitto_logs:
  mcm_data:
