services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mcm-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./deploy/mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
      # - ./deploy/mosquitto/certs:/mosquitto/certs:ro  # required when enabling the TLS listener
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t mcm/healthcheck -m ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mcm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcm-server
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - mcm_data:/var/lib/mcm
    # Dev defaults: MCM_AUTH_JWT_SECRET and MCM_BOOTSTRAP_ADMIN_PASSWORD
    # are left unset so the Go runtime auto-generates them on first boot.
    # The JWT secret is persisted to <db dir>/.bootstrap.json (mode 0600)
    # and reused on subsequent restarts. The bootstrap admin password is
    # logged once on first boot — recover it via `task logs` / `docker
    # compose logs mcm`. Operators that want explicit credentials (e.g.
    # production) should layer in `docker-compose.prod.yml` instead of
    # editing this file; see deploy/mcm/README.md for the override shape.
    #
    # MCM_BOOTSTRAP_ADMIN_USERNAME is also left unset on purpose: the
    # validator rejects the "username set, password empty" combination,
    # and the auto-generation path only fires when both are unset. The
    # default username "admin" is applied by internal/config.Load() when
    # the env var is absent.
    #
    # Other fields come from internal/config.Default() and may be
    # overridden with MCM_* env vars (MCM_HTTP_PORT, MCM_DATABASE_PATH,
    # MCM_MOSQUITTO_HOST, etc.).
    environment:
      MCM_MOSQUITTO_HOST: mosquitto
      MCM_HTTP_BIND_ADDRESS: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/livez || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  mosquitto_data:
  mosquitto_logs:
  mcm_data:
