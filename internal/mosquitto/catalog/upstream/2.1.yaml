# Upstream Mosquitto 2.1 directive inventory.
#
# This file lists every directive the Mosquitto 2.1 configuration manual
# documents (man/mosquitto.conf.5.xml of the eclipse/mosquitto v2.1.0 tag).
# It is the universe the support matrix classifies: a directive MCM does
# not know is not "unsupported by the broker", it is simply not managed
# by MCM for that version.
#
# The list is deliberately the upstream truth and not the MCM catalog:
# the catalog only describes the directives MCM manages. Comparing the
# two is what produces the "supported / partial / unsupported" rows of
# the published matrix, and it is what keeps MCM from claiming a
# compatibility it does not have.
#
# Regenerate the derived matrix with `go run ./scripts/gen-support-matrix`.
