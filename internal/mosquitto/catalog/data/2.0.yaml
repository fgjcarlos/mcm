# Mosquitto 2.0 directive catalog — issues #298 and #302.
#
# Each entry pins the value shape, scope (global vs listener-block),
# multiplicity, restart-vs-reload semantics, the earliest version Mosquitto
# accepts the directive, optional enum allowed values, and any
# co-dependencies the validator should enforce.
#
# Entries that carry a `section` are exposed as editable fields in the
# graphical settings form (issue #302): persistence, queues, sessions and
# logging. `unit`, `min` and `max` describe the accepted range so the form
# can show the bounds and the server can refuse out-of-range values before
# the broker is touched. `default` is the broker default and is shown as
# help text.
#
# The reload_kind values follow Mosquitto's own parser: a directive the
# broker skips when it re-reads the file on SIGHUP is marked `restart`.
#
# The set covers the directives we ship today in
# deploy/mosquitto/config/mosquitto.conf plus the TLS directives that
# issue #300 (Broker TLS) will need. New directives are added per version;
# operators can still import files containing unknown directives — they
# are preserved byte-for-byte and surface as ValidationIssue with kind
# "unknown" so the UI can warn without blocking the import.
---
name: listener
type: integer
scope: listener
multiplicity: many
reload_kind: restart
since_version: "1.0"
description: |
  Starts a new listener on the given port. Bound to the listener block
  that follows; the optional second argument is the bind address.
---
name: port
type: integer
scope: global
multiplicity: once
reload_kind: restart
since_version: "1.0"
description: |
  Default port for clients. Mosquitto 2.0 removes the default port when
  no listener is configured, so this is informational on most setups.
---
name: max_connections
type: integer
scope: any
multiplicity: once_per_block
reload_kind: restart
since_version: "1.0"
section: sessions
unit: connections
min: -1
max: 2147483647
default: "-1"
description: |
  Maximum number of concurrent client connections. Mosquitto applies the
  value to the listener it is written in; at global scope it configures
  the default listener. -1 means unlimited. A limit set inside a listener
  block belongs to that listener only. Listeners are not re-read on
  SIGHUP, so changing this needs a broker restart.
---
name: protocol
type: enum
scope: listener
multiplicity: many
reload_kind: reload
since_version: "1.0"
allowed_values: [mqtt, websockets]
description: |
  Protocols accepted by this listener. Repeatable per listener block.
---
name: allow_anonymous
type: boolean
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
description: Allow anonymous client connections (no password file required).
---
name: password_file
type: path
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
description: |
  Path to the mosquitto password file. MCM writes this file on every
  successful deploy apply.
---
name: acl_file
type: path
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
description: Path to the Mosquitto ACL file. MCM writes this file on every apply.
---
name: persistence
type: boolean
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
section: persistence
default: "false"
description: |
  Enable the persistent store for retained messages, subscriptions and
  in-flight QoS 1/2 messages. When disabled the broker keeps no state
  across a restart.
---
name: persistence_file
type: string
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
section: persistence
default: "mosquitto.db"
description: |
  Name of the persistence database inside the persistence directory. The
  broker rewrites this file on every save cycle, so point it at a
  writable location.
---
name: persistence_location
type: path
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
section: persistence
description: |
  Directory holding the persistence database. The broker re-opens the
  directory when it reloads its configuration, but it does not move an
  existing database to a new location — copy it by hand after the change.
---
name: autosave_interval
type: integer
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
section: persistence
unit: seconds
min: 0
max: 2147483647
default: "1800"
description: |
  How often the broker writes the persistence database to disk, in
  seconds. 0 disables the periodic write.
---
name: autosave_on_changes
type: boolean
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
section: persistence
default: "false"
description: |
  Write the persistence database to disk as soon as it holds unsaved
  changes instead of waiting for the autosave interval.
---
name: max_queued_messages
type: integer
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
section: queues
unit: messages
min: 0
max: 2147483647
default: "1000"
description: |
  Maximum number of QoS 1 and 2 messages held for a client that is not
  connected. 0 means no limit. Clients that exceed the limit are
  disconnected.
---
name: max_inflight_messages
type: integer
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
section: queues
unit: messages
min: 0
max: 65535
default: "20"
description: |
  Maximum number of QoS 1 and 2 messages in flight to a client at the
  same time. 0 means no limit.
---
name: max_queued_bytes
type: integer
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
section: queues
unit: bytes
min: 0
max: 9223372036854775807
default: "0"
description: |
  Maximum number of bytes held in the message queues of disconnected
  clients. 0 means no limit.
---
name: max_inflight_bytes
type: integer
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
section: queues
unit: bytes
min: 0
max: 9223372036854775807
default: "0"
description: |
  Maximum number of bytes held for messages in flight to connected
  clients. 0 means no limit.
---
name: queue_qos0_messages
type: boolean
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
section: queues
default: "false"
description: |
  Keep QoS 0 messages in the queue for disconnected clients. QoS 0 is not
  acknowledged, so the broker cannot tell whether the client received
  them.
---
name: max_packet_size
type: integer
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
section: queues
unit: bytes
min: 20
max: 4294967295
default: "0"
description: |
  Largest MQTT packet the broker accepts, in bytes. The broker refuses
  values below 20 bytes. In Mosquitto 2.0 the default 0 means no limit;
  Mosquitto 2.1 defaults to 2000000 bytes instead.
---
name: memory_limit
type: integer
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
unit: bytes
min: 0
max: 9223372036854775807
description: |
  Cap on the memory the broker uses for its queues. Only effective on a
  broker built with memory tracking (WITH_MEMORY_TRACKING); other builds
  ignore the value.
---
name: message_size_limit
type: integer
scope: global
multiplicity: once
reload_kind: reload
since_version: "2.0.18"
unit: bytes
min: 0
max: 268435455
description: |
  Largest MQTT payload the broker accepts, in bytes. Mosquitto reports
  this option as deprecated in favour of max_packet_size, so MCM keeps it
  out of the settings form and only recognises it.
---
name: max_keepalive
type: integer
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
section: sessions
unit: seconds
min: 0
max: 65535
default: "0"
description: |
  Keepalive the broker accepts from a client, in seconds. 0 accepts any
  keepalive the client asks for.
---
name: persistent_client_expiration
type: duration
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
section: sessions
duration_suffixes: [h, d, w, m, y]
description: |
  How long the broker keeps the network connection of a disconnected
  persistent client, written as an integer and a unit: 1h, 7d, 2w, 6m
  or 1y. Without this option the broker never expires them.
---
name: log_dest
type: enum
scope: global
multiplicity: many
reload_kind: reload
since_version: "1.0"
section: logging
allowed_values: [none, syslog, stdout, stderr, topic, dlt, file]
default: "stderr"
description: |
  Destination of log messages. Repeatable to write to several
  destinations. The 'file' value takes the log file path as an extra
  argument and only one file destination is allowed.
---
name: log_type
type: enum
scope: global
multiplicity: many
reload_kind: reload
since_version: "1.0"
section: logging
allowed_values: [none, information, notice, warning, error, debug, subscribe, unsubscribe, internal, websockets, all]
default: "error, warning, notice, information"
description: |
  Categories of messages the broker writes to the log. Repeatable to log
  several categories.
---
name: log_timestamp
type: boolean
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
section: logging
default: "true"
description: |
  Prefix every log line with a timestamp.
---
name: log_timestamp_format
type: string
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
section: logging
description: |
  strftime format used for the log timestamp, for example
  "%Y-%m-%dT%H:%M:%S". Without it the broker writes the Unix time.
---
name: connection_messages
type: boolean
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
section: logging
default: "false"
description: Log a message for every client connect / disconnect.
---
name: log_facility
type: integer
scope: global
multiplicity: once
reload_kind: reload
since_version: "1.0"
section: logging
unit: facility
min: 0
max: 7
default: "3"
description: |
  Syslog facility the broker logs to, from 0 (local0) to 7 (local7).
  Only used when a syslog destination is configured.
---
name: user
type: string
scope: global
multiplicity: once
reload_kind: restart
since_version: "1.0"
description: |
  User the broker drops to after binding privileged ports. Cannot be
  reloaded — requires a full restart.
---
name: cafile
type: path
scope: global
multiplicity: once
reload_kind: restart
since_version: "1.0"
listener_since_version: "2.0"
description: |
  Path to a file containing PEM-encoded CA certificates for the broker
  identity and (optionally) client verification. The broker reads the
  file at start-up, so changing it needs a restart.
---
name: capath
type: path
scope: global
multiplicity: once
reload_kind: restart
since_version: "1.0"
listener_since_version: "2.0"
description: |
  Directory containing PEM-encoded CA certificates (one per file with
  hashed names, see OpenSSL c_re_hash). The broker reads the directory
  at start-up, so changing it needs a restart.
---
name: certfile
type: path
scope: global
multiplicity: once
reload_kind: restart
since_version: "1.0"
listener_since_version: "2.0"
description: |
  Path to the broker PEM certificate. Loaded at start-up — changing it
  requires a broker restart.
---
name: keyfile
type: path
scope: global
multiplicity: once
reload_kind: restart
since_version: "1.0"
listener_since_version: "2.0"
description: |
  Path to the broker PEM private key. Loaded at start-up — changing it
  requires a broker restart.
---
name: require_certificate
type: boolean
scope: global
multiplicity: once
reload_kind: restart
since_version: "1.0"
listener_since_version: "2.0"
description: |
  When true, clients MUST present a valid X.509 certificate (used
  together with cafile / capath). Enforced from the next connection, so
  the broker needs a restart to apply it to existing listeners.
---
name: tls_version
type: enum
scope: global
multiplicity: many
reload_kind: restart
since_version: "1.0"
listener_since_version: "2.0"
allowed_values: ["tlsv1", "tlsv1.1", "tlsv1.2", "tlsv1.3"]
description: |
  TLS protocol versions the broker accepts. Repeatable; latest entry
  wins. The TLS stack is set up at start-up, so changing this needs a
  restart.
---
---
name: connection
type: string
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Starts a bridge to a remote broker. Every directive that follows the
  connection line belongs to it until the next connection. Mosquitto reads
  the bridge only at start-up, so a change needs a restart.
---
name: address
type: string
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Address of the remote broker as host or host:port. One address per
  connection.
---
name: remote_clientid
type: string
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Client id the bridge uses on the remote broker. Must be unique across
  the bridges of the file: Mosquitto derives the local client id from it.
---
name: local_clientid
type: string
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Client id the bridge uses on the local broker. Must be unique across
  the bridges of the file.
---
name: remote_username
type: string
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  User name the bridge authenticates with on the remote broker.
---
name: remote_password
type: string
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Password the bridge authenticates with on the remote broker. The value is
  a secret: it is never returned by the API, only whether it is set.
---
name: local_username
type: string
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  User name the bridge authenticates with on the local broker.
---
name: local_password
type: string
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Password the bridge authenticates with on the local broker. The value is
  a secret: it is never returned by the API, only whether it is set.
---
name: bridge_protocol_version
type: enum
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
allowed_values: ["mqttv31", "mqttv311", "mqttv50"]
description: |
  MQTT version the bridge speaks with the remote broker.
---
name: cleansession
type: boolean
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Clean session flag of the remote connection.
---
name: local_cleansession
type: boolean
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Clean session flag of the local side of the bridge.
---
name: keepalive_interval
type: integer
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
unit: seconds
min: 5
max: 65535
default: "60"
description: |
  Keepalive of the remote connection in seconds. Mosquitto refuses a value
  below 5.
---
name: restart_timeout
type: string
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Reconnection backoff of the bridge, either a number of seconds or a base
  and cap pair such as "5 30".
---
name: notifications
type: boolean
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Publishes the state of the bridge connection on the notification topic.
---
name: notifications_local_only
type: boolean
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Keeps the bridge notifications inside the local broker.
---
name: notification_topic
type: string
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Topic the bridge publishes its connection state on.
---
name: try_private
type: boolean
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Uses the private flag of the messages the bridge forwards. It keeps the
  broker from forwarding a message it received from the remote broker back
  to it.
---
name: start_type
type: enum
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
allowed_values: ["automatic", "lazy", "once"]
description: |
  When the bridge connection is established.
---
name: threshold
type: integer
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
unit: messages
min: 1
description: |
  Number of queued messages that makes the bridge reconnect.
---
name: idle_timeout
type: integer
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
unit: seconds
min: 0
description: |
  Closes the bridge connection after this many seconds without traffic.
---
name: round_robin
type: boolean
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Spreads the outgoing messages over the addresses of the bridge.
---
name: bridge_cafile
type: path
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  CA certificate file used to verify the certificate of the remote broker.
---
name: bridge_capath
type: path
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Directory of CA certificates used to verify the certificate of the remote
  broker.
---
name: bridge_certfile
type: path
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Client certificate the bridge presents to the remote broker. Requires the
  matching private key.
---
name: bridge_keyfile
type: path
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Private key of the client certificate the bridge presents. Requires the
  matching certificate.
---
name: bridge_insecure
type: boolean
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Skips the verification of the certificate of the remote broker. The
  traffic is then readable by anyone able to intercept the connection.
---
name: bridge_tls_version
type: enum
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
allowed_values: ["tlsv1.2", "tlsv1.3"]
description: |
  TLS version the bridge accepts from the remote broker.
---
name: bridge_alpn
type: string
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Application protocol the bridge offers during the TLS handshake.
---
name: bridge_identity
type: string
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Identity of the pre-shared key the bridge uses instead of a certificate.
---
name: bridge_psk
type: string
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Pre-shared key the bridge uses instead of a certificate. The value is a
  secret: it is never returned by the API, only whether it is set.
---
name: bridge_require_ocsp
type: boolean
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Requires a stapled OCSP response in the certificate of the remote broker.
---
name: bridge_outgoing_retain
type: boolean
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Keeps the retain flag of the messages the bridge forwards.
---
name: bridge_max_packet_size
type: integer
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
unit: bytes
min: 0
description: |
  Largest message the bridge sends to the remote broker. Zero means no
  limit.
---
name: topic
type: string
scope: bridge
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Topic pattern the bridge forwards, optionally followed by the direction
  (in, out or both), the quality of service and the local and remote
  prefixes.
---
name: plugin
type: path
scope: global
multiplicity: many
reload_kind: restart
since_version: "1.0"
description: |
  Loads a Mosquitto plugin from a shared object. Repeatable. Mosquitto
  loads a plugin at start-up and never re-reads the directive on SIGHUP,
  so changing it needs a broker restart. The plugin catalog of MCM
  describes the plugins it is able to configure.
---
name: plugin_opt_config_file
type: path
scope: global
multiplicity: many
reload_kind: restart
since_version: "2.0"
description: |
  Path of the JSON security database of the dynamic security plugin. The
  option belongs to the `plugin` directive that precedes it.
