# Production-hardened example — review deploy/mosquitto/README.md before use.
#
# This file is a starting point for a hardened Mosquitto configuration
# that is fully aligned with the MCM managed deploy flow (issue #294).
# It disables anonymous access, enables a TLS listener, and binds the
# plain-text listener to 0.0.0.0 so it is reachable on the Docker Compose
# bridge network (e.g. from the mcm service in the same stack).
#
# Paths match what MCM writes by default — both passwd and acl live in
# /mosquitto/config so the FileApplier can atomically rename them on
# every deploy apply without crossing filesystems.
#
# Steps before first use:
#   1. Create a password file ON THE HOST (the config dir is mounted read-only
#      into the container; Mosquitto only reads it at startup):
#        mosquitto_passwd -c deploy/mosquitto/config/passwd <username>
#      Re-run without -c to add more users.
#   2. Supply TLS certificates (see the TLS listener section below and
#      deploy/mosquitto/README.md for the MCM-side TLS checklist).
#   3. Mount this file as /mosquitto/config/mosquitto.conf in your
#      container or replace the dev conf in docker-compose.yml.

# ---------------------------------------------------------------------------
# Persistence and logging (same as dev)
# ---------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# ---------------------------------------------------------------------------
# Authentication — password + ACL files (MCM-managed)
# ---------------------------------------------------------------------------
# Disable anonymous connections.  All clients must present a valid username
# and password from the file below.
allow_anonymous false
password_file /mosquitto/config/passwd

# ACL file. Empty initially (MCM writes the rendered ACL on every
# successful deploy apply). When the file is empty Mosquitto applies
# default-allow for authenticated users; MCM emits explicit rules so
# the deployed behaviour is deterministic.
acl_file /mosquitto/config/acl

# ---------------------------------------------------------------------------
# Plain-text MQTT listener (port 1883)
# ---------------------------------------------------------------------------
# Bound to 0.0.0.0 so it is reachable on the isolated Docker Compose bridge
# network (e.g. by the mcm service in the same stack).  Binding to 127.0.0.1
# would break container-to-container connectivity because the loopback
# interface is private to each container.  For bare-metal or reverse-proxy
# setups where you want to restrict the listener to the local host only,
# comment out the line below and uncomment the loopback alternative.
listener 1883 0.0.0.0
# listener 1883 127.0.0.1  # bare-metal only: breaks container-to-container networking

# ---------------------------------------------------------------------------
# TLS MQTT listener (port 8883)
# ---------------------------------------------------------------------------
# Replace the placeholder paths with real certificate/key files.
# See deploy/mosquitto/README.md for the full TLS checklist.
listener 8883

# Path to the CA certificate used to verify connecting clients when
# require_certificate is true.  Also used as the trusted CA chain when
# issuing server certificates from an internal CA.
cafile /mosquitto/certs/ca.crt

# Broker server certificate and private key.
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

# Uncomment to require clients to present a valid TLS client certificate.
# This enables mutual TLS (mTLS): both the broker and the MCM client must
# have certificates signed by the CA above.
# See deploy/mosquitto/README.md for guidance on issuing the MCM client cert.
# require_certificate true

# ---------------------------------------------------------------------------
# Production notes (issue #294)
# ---------------------------------------------------------------------------
# • Do NOT add `user root` here. Production should run Mosquitto as the
#   official `mosquitto` UID and share a UID (or group) with the MCM
#   process so the FileApplier can atomically rename passwd/acl into
#   place. Cross-UID writes need a shared group + setgid bit on the
#   config dir, not `chmod 777`.
# • Do NOT mount the Docker socket into the MCM container. Use
#   MCM_MOSQUITTO_DEPLOY_MODE=file with MCM_MOSQUITTO_DEPLOY_RELOAD_COMMAND
#   to signal the broker (e.g. "systemctl reload mosquitto.service")
#   from outside the broker's process namespace. The dev `docker exec`
#   path remains for the dev Compose stack only.
# • The MCM startup capability check (internal/server.checkDeployCapabilities)
#   verifies that the ACL/passwd parent directories are writable by the
#   MCM process before serving traffic. Fail-fast with an actionable
#   error if not.
