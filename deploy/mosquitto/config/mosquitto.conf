# MCM local development Mosquitto configuration
#
# This file is intentionally permissive for local development so contributors
# can connect immediately with tools such as mosquitto_pub, mosquitto_sub,
# Node-RED, MQTT Explorer, or the future MCM backend.
#
# Do not use this configuration as-is in production.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Plain MQTT listener for local development.
listener 1883 0.0.0.0
allow_anonymous true

# WebSocket listener for browser-based MQTT clients and future UI experiments.
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
