# MCM local development Mosquitto configuration
#
# This file enables authentication and ACL enforcement so the dev stack
# mirrors the production-hardened contract. The passwd/acl files live in
# /mosquitto/config/, which is a NAMED VOLUME shared with the mcm
# service. MCM writes the rendered passwd/acl there on every successful
# deploy apply and signals the broker via SIGHUP (PID 1).
#
# The initial passwd file is created by deploy/mosquitto/config/mosquitto-bootstrap.sh
# on first boot with a single dev admin user so MCM can connect to the
# broker at startup.
#
# Do not use this configuration as-is in production. See
# deploy/mosquitto/config/mosquitto.prod.conf for a TLS-only production
# template and deploy/mosquitto/README.md for the integration guide.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# ---------------------------------------------------------------------------
# Authentication — shared passwd/acl files managed by MCM
# ---------------------------------------------------------------------------
# Disable anonymous connections.  All clients must present a valid username
# and password from the file below. The file is rendered by MCM on every
# successful deploy apply and written into the shared volume that this
# container reads from.
allow_anonymous false
password_file /mosquitto/config/passwd

# ACL file: empty by default. MCM writes one on every apply when there are
# any rules defined. An empty file means "no per-user restrictions" beyond
# the password requirement; MCM can also choose to write `acl_file` with
# explicit deny rules when a deploy is previewed/applied.
acl_file /mosquitto/config/acl

# Run as root inside the container so the broker can read the passwd/acl
# files written by the MCM service. The dev stack shares a named volume
# between the two containers; they have different UIDs (mcm vs.
# mosquitto) so the cross-container files would otherwise be
# inaccessible. The production template (mosquitto.prod.conf) keeps the
# default `user mosquitto` and uses `mosquitto_passwd -c` on the host to
# create passwd as the mosquitto user before launching — that is the
# documented production pattern, NOT this dev shortcut.
user root

# Plain MQTT listener for local development.
listener 1883 0.0.0.0

# WebSocket listener for browser-based MQTT clients and the MCM frontend.
listener 9001 0.0.0.0
protocol websockets
