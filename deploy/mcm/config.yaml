# MCM PRODUCTION configuration template.
#
# This file is a PRODUCTION-READY template showing the full file-based
# config path. The dev Compose stack does NOT mount this file — the
# dev quickstart generates only the JWT secret and persists it to
# <db dir>/.bootstrap.json. The operator creates the first account.
#
# For production, set a strong, unique JWT secret and choose one route:
#   - With docker-compose.secrets.yml, set MCM_SETUP_TOKEN for interactive
#     setup, or both MCM_BOOTSTRAP_ADMIN_USERNAME and
#     MCM_BOOTSTRAP_ADMIN_PASSWORD for automated provisioning.
#   - With this file mounted at /etc/mcm/config.yaml, set setup_token and
#     clear both bootstrap_admin fields for interactive setup. For automated
#     provisioning, replace the placeholder bootstrap_admin password.
# Supply sensitive values through your secret configuration; the validator
# rejects the shipped placeholder credentials.

http:
  bind_address: "0.0.0.0"
  port: 8080
  # If MCM runs behind a reverse proxy, list the proxy IPs/CIDRs here so its
  # X-Forwarded-For header is honored for client IPs (rate-limit lockout, audit).
  # Empty = trust no headers and use the direct peer address (safe default).
  trusted_proxies: []

database:
  path: "/var/lib/mcm/mcm.db"

auth:
  jwt_secret: "replace-this-secret-with-at-least-32-characters"
  token_ttl: "24h"
  # Required for interactive first-admin setup; configure separately from broker credentials.
  setup_token: ""
  bootstrap_admin:
    username: "admin"
    password: "change-this-admin-password"
  login_lockout:
    window: "15m"
    max_attempts: 10

mosquitto:
  host: "mosquitto"
  port: 1883

metrics:
  broker_retention: "1h"
  audit_retention: "2160h"
  security_retention: "2160h"

logging:
  level: "info"
  format: "json"
