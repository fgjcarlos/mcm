# MCM Docker Compose configuration template.
# REQUIRED before first run: set jwt_secret and bootstrap_admin.password below.
# This file ships with placeholder values that fail validation — mcm will not
# start until you replace them with strong, unique secrets.

http:
  bind_address: "0.0.0.0"
  port: 8080
  # If MCM runs behind a reverse proxy, list the proxy IPs/CIDRs here so its
  # X-Forwarded-For header is honored for client IPs (rate-limit lockout, audit).
  # Empty = trust no headers and use the direct peer address (safe default).
  trusted_proxies: []

database:
  path: "/var/lib/mcm/mcm.db"

auth:
  jwt_secret: "replace-this-secret-with-at-least-32-characters"
  token_ttl: "24h"
  bootstrap_admin:
    username: "admin"
    password: "change-this-admin-password"
  login_lockout:
    window: "15m"
    max_attempts: 10

mosquitto:
  host: "mosquitto"
  port: 1883

metrics:
  broker_retention: "1h"
  audit_retention: "2160h"
  security_retention: "2160h"
  # require_auth gates GET /metrics behind a valid admin JWT (auditor role or higher).
  # Configure Prometheus with bearer_token: <jwt> in your scrape_config.
  # Set to false only when a trusted reverse proxy handles scrape authentication.
  require_auth: true

status:
  # require_auth gates GET /api/v1/status behind a valid admin JWT (viewer role or higher).
  # The dashboard always sends its session token, so this is transparent to UI users.
  # Set to false only for unauthenticated external health monitoring.
  require_auth: true

logging:
  level: "info"
  format: "json"
