# MCM local development configuration for Docker Compose.
# Do not use these credentials in production.

http:
  bind_address: "0.0.0.0"
  port: 8080
  # If MCM runs behind a reverse proxy, list the proxy IPs/CIDRs here so its
  # X-Forwarded-For header is honored for client IPs (rate-limit lockout, audit).
  # Empty = trust no headers and use the direct peer address (safe default).
  trusted_proxies: []

database:
  path: "/var/lib/mcm/mcm.db"

auth:
  jwt_secret: "mcm-dev-secret-change-in-production"
  token_ttl: "24h"
  bootstrap_admin:
    username: "admin"
    password: "admin"
  login_lockout:
    window: "15m"
    max_attempts: 10

mosquitto:
  host: "mosquitto"
  port: 1883

metrics:
  broker_retention: "1h"

logging:
  level: "info"
  format: "json"
